<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>스킨로그 MVP</title>
  <style>
    :root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--dark:#0f172a;--soft:#f8fafc;--danger:#dc2626}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Segoe UI,sans-serif;color:var(--text)}
    button,input,textarea,select{font:inherit} button{cursor:pointer;border:0;background:none;color:inherit} .app{max-width:480px;min-height:100vh;margin:0 auto;background:white;box-shadow:0 10px 35px rgba(15,23,42,.12);position:relative;padding-bottom:88px}.screen{padding:16px}.header{position:sticky;top:0;z-index:10;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(8px)}.title{font-weight:900;font-size:18px}.head-slot{width:44px}.back,.iconbtn{width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center}.back:hover,.iconbtn:hover{background:#f1f5f9}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.04)}.soft{background:var(--soft)}.btn{height:52px;border-radius:18px;background:var(--dark);color:white;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:0 1px 4px rgba(15,23,42,.16)}.btn.outline{background:white;color:var(--text);border:1px solid var(--line);box-shadow:none}.btn.danger{color:var(--danger);border-color:#fecaca}.btn.small{height:42px;font-size:14px;border-radius:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stack{display:flex;flex-direction:column;gap:14px}.label{display:block;font-size:14px;font-weight:900;margin:0 0 8px}.input,.textarea,.select{width:100%;border:1px solid var(--line);border-radius:18px;padding:0 14px;outline:none;background:white}.input,.select{height:48px}.textarea{min-height:96px;padding:14px;resize:vertical}.input:focus,.textarea:focus,.select:focus{border-color:var(--dark)}.muted{color:var(--muted)}.tiny{font-size:12px}.small{font-size:14px}.bold{font-weight:900}.center{text-align:center}.divider{height:1px;background:var(--line)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:30}.nav button{border-radius:18px;padding:8px 4px;font-size:12px;color:#64748b;font-weight:700}.nav button.active{background:var(--dark);color:white}.avatar{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:999px;background:#f1f5f9;overflow:hidden;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:#f1f5f9;color:#475569;border-radius:999px;padding:8px 12px;font-weight:900;font-size:14px}.chip.active{background:var(--dark);color:white}.summary-card{text-align:center;border:1px solid var(--line);border-radius:22px;padding:14px 8px}.summary-card .value{font-size:20px;font-weight:1000;margin-top:8px}.photo-add{height:132px;border:2px dashed var(--line);border-radius:24px;background:#f8fafc;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#64748b;font-weight:900}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo-item{position:relative;border-radius:16px;overflow:hidden;background:#f1f5f9;height:88px}.photo-item img{width:100%;height:100%;object-fit:cover}.photo-del{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:999px;background:rgba(255,255,255,.92);font-weight:900}.part{border:1px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center;font-weight:900;font-size:14px}.part.active{background:var(--dark);color:white;border-color:var(--dark)}.score{border:1px solid var(--line);border-radius:22px;padding:14px}.score-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.score-badge{background:#f1f5f9;border-radius:999px;padding:5px 10px;font-weight:900}.range{width:100%;accent-color:#0f172a}.record-row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);border-radius:22px;background:white;padding:10px}.thumb{width:64px;height:64px;border-radius:16px;background:#f1f5f9;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#94a3b8}.thumb img{width:100%;height:100%;object-fit:cover}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}.day{height:30px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#64748b}.day.mark span{background:var(--dark);color:white}.day span{width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#f8fafc}.mini{border-radius:18px;background:#f1f5f9;text-align:center;padding:11px 2px}.mini .n{font-size:18px;font-weight:1000}.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);max-width:448px;width:calc(100% - 32px);background:#0f172a;color:white;text-align:center;padding:12px 14px;border-radius:18px;font-weight:900;z-index:40;box-shadow:0 10px 30px rgba(15,23,42,.2)}.empty{border:1px dashed var(--line);border-radius:24px;text-align:center;padding:28px}.onboarding{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}.onboarding .box{max-width:420px;width:100%;background:white;border-radius:30px;padding:28px;box-shadow:0 10px 40px rgba(15,23,42,.14)}.logo{width:64px;height:64px;border-radius:24px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px}.appname{font-size:38px;font-weight:1000;letter-spacing:-1px}.section-title{font-size:15px;font-weight:1000;margin:4px 0}.warning{border:1px dashed var(--line);border-radius:22px;padding:16px;line-height:1.6}.linkish{text-decoration:underline;color:#475569;font-weight:900}.seg{height:54px;border:1px solid var(--line);border-radius:18px;font-weight:900}.seg.active{background:#0f172a;color:white;border-color:#0f172a}.profile-photo-box{border:1px solid var(--line);border-radius:24px;padding:16px}.profile-photo-row{display:flex;gap:14px;align-items:center}.hidden{display:none}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.compare{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.compare-img{height:112px;border-radius:22px;background:#f1f5f9;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#94a3b8}.compare-img img{width:100%;height:100%;object-fit:cover}.settings-row{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid #f1f5f9}.settings-row:last-child{border-bottom:0}.pill-list{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:900;background:#f1f5f9}.pill.active{background:#0f172a;color:white}.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mb2{margin-bottom:8px}.hide{display:none!important}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const STORAGE_KEY = 'skinlog_mvp_v1';
    const PHOTO_LIMIT = 10;
    const VERSION_LABEL = 'v7-profile-edit-fixed';
    const SELF_EMOJI = '😊';
    const CHILD_EMOJI = '😘';
    const BODY_PARTS = [
      { key: 'face', label: '얼굴' }, { key: 'neck', label: '목' }, { key: 'arm', label: '팔' }, { key: 'leg', label: '다리' },
      { key: 'trunk', label: '몸통' }, { key: 'hand', label: '손' }, { key: 'foot', label: '발' }, { key: 'other', label: '기타' },
    ];
    const SLEEP_OPTIONS = [
      { key: '', label: '선택 안 함' }, { key: 'good', label: '좋음' }, { key: 'normal', label: '보통' }, { key: 'bad', label: '나쁨' },
    ];
    const DEFAULT_STATE = { onboardingCompleted:false, profiles:[], selectedProfileId:null, records:[] };
    let state = loadState();
    let view = 'home';
    let draft = null;
    let detailId = null;
    let formMode = 'create';
    let addingProfile = false;
    let editingProfileId = null;
    let toastTimer = null;

    const $root = document.getElementById('root');

    function uid(prefix='id'){ return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,8)}`; }
    function profileEmoji(profile){ return profile && profile.type === 'child' ? CHILD_EMOJI : SELF_EMOJI; }
    function avatarHTML(profile, size=32){
      const emoji = profileEmoji(profile);
      if(profile && profile.avatarDataUrl){
        return `<span class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.max(14,size*.42)}px"><img src="${escapeAttr(profile.avatarDataUrl)}" alt="프로필 사진"></span>`;
      }
      return `<span class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.max(14,size*.42)}px">${emoji}</span>`;
    }
    function escapeHTML(str=''){ return String(str).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function escapeAttr(str=''){ return escapeHTML(str).replace(/`/g,'&#96;'); }
    function todayLocalInputValue(){ const now=new Date(); const tz=now.getTimezoneOffset()*60000; return new Date(now.getTime()-tz).toISOString().slice(0,16); }
    function formatDateTime(value){ if(!value) return '-'; const d=new Date(value); if(isNaN(d)) return value; return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'}).format(d); }
    function formatDateOnly(value){ if(!value) return '-'; const d=new Date(value); if(isNaN(d)) return value; return new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(d); }
    function daysAgoText(value){ if(!value) return '기록 없음'; const d=new Date(value); const t=new Date(); const sT=new Date(t.getFullYear(),t.getMonth(),t.getDate()); const sD=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const diff=Math.round((sT-sD)/(86400000)); if(diff===0)return'오늘'; if(diff===1)return'1일 전'; return `${diff}일 전`; }
    function bodyPartLabel(key){ return (BODY_PARTS.find(x=>x.key===key)||{}).label || key; }
    function sleepLabel(key){ return (SLEEP_OPTIONS.find(x=>x.key===key)||{}).label || '-'; }
    function clampScore(v){ const n=Number(v); return Number.isNaN(n)?0:Math.max(0,Math.min(10,n)); }
    function average(values){ const valid=values.filter(v=>typeof v==='number'&&!Number.isNaN(v)); if(!valid.length)return 0; return Number((valid.reduce((a,b)=>a+b,0)/valid.length).toFixed(1)); }
    function withinDays(recordedAt, days){ const rd=new Date(recordedAt); if(isNaN(rd))return false; const now=new Date(); const start=new Date(now); start.setDate(now.getDate()-days+1); start.setHours(0,0,0,0); return rd>=start && rd<=now; }
    function getSelectedProfile(){ return state.profiles.find(p=>p.id===state.selectedProfileId) || state.profiles[0] || null; }
    function normalizeRecord(record, selectedProfileId){ return {...record, profileId: record.profileId || selectedProfileId || null, food: record.food || {breakfast:'',lunch:'',dinner:'',snack:record.foodMemo||''}, foodMemo: record.foodMemo || (record.food && record.food.snack) || ''}; }
    function normalizeState(raw){ const base={...DEFAULT_STATE,...(raw||{})}; const profiles=Array.isArray(base.profiles)?base.profiles:(base.profile?[base.profile]:[]); const selectedProfileId=base.selectedProfileId || (profiles[0]&&profiles[0].id) || null; const records=Array.isArray(base.records)?base.records.map(r=>normalizeRecord(r,selectedProfileId)):[]; return {onboardingCompleted:Boolean(base.onboardingCompleted),profiles,selectedProfileId,records}; }
    function createEmptyRecord(profileId=null){ return {id:uid('record'),profileId,recordedAt:todayLocalInputValue(),bodyParts:[],photos:[],symptoms:{itchScore:0,rednessScore:0,oozeScore:0,scaleScore:0,scratchScore:0},medicines:'',foodMemo:'',food:{breakfast:'',lunch:'',dinner:'',snack:''},sleepStatus:'',note:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}; }
    function loadState(){ try{ const raw=localStorage.getItem(STORAGE_KEY); if(!raw) return {...DEFAULT_STATE}; return normalizeState(JSON.parse(raw)); }catch(e){ return {...DEFAULT_STATE}; } }
    function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(normalizeState(state))); }catch(e){ console.warn(e); showToast('저장 공간이 부족할 수 있어요. 백업 후 사진 수를 줄여주세요.'); } }
    function setState(next){ state = normalizeState(typeof next === 'function' ? next(state) : next); saveState(); render(); }
    function showToast(msg){ clearTimeout(toastTimer); const old=document.querySelector('.toast'); if(old) old.remove(); const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); toastTimer=setTimeout(()=>el.remove(),1800); }
    function go(nextView){ detailId=null; draft=null; formMode='create'; addingProfile=false; editingProfileId=null; view=nextView; render(); }
    function selectProfile(id){ state.selectedProfileId=id; saveState(); render(); }
    function startNewRecord(){ formMode='create'; draft=createEmptyRecord(getSelectedProfile()?.id || null); view='form'; render(); }
    function editRecord(record){ formMode='edit'; draft=JSON.parse(JSON.stringify(normalizeRecord(record, record.profileId))); detailId=null; view='form'; render(); }
    function saveRecord(record){ const isEdit=formMode==='edit'; const profileId=record.profileId || state.selectedProfileId || getSelectedProfile()?.id || null; const recordWithProfile=normalizeRecord({...record,profileId,updatedAt:new Date().toISOString()}, profileId); const exists=state.records.some(x=>x.id===record.id); state.records=exists?state.records.map(x=>x.id===record.id?recordWithProfile:x):[{...recordWithProfile,createdAt:new Date().toISOString()},...state.records]; state=normalizeState(state); saveState(); draft=null; formMode='create'; detailId=null; view='records'; render(); showToast(isEdit?'기록이 수정되었습니다.':'기록이 저장되었습니다.'); }
    function deleteRecord(id){ if(!confirm('이 기록을 삭제할까요? 삭제한 기록은 복구할 수 없습니다.'))return; state.records=state.records.filter(r=>r.id!==id); state=normalizeState(state); saveState(); detailId=null; view='records'; render(); }
    function saveProfile(profile, isUpdate=false){ if(isUpdate){ state.profiles=state.profiles.map(p=>p.id===profile.id?profile:p); state.selectedProfileId=profile.id; editingProfileId=null; showToast('프로필이 수정되었습니다.'); } else { state.profiles=[...state.profiles, profile]; state.selectedProfileId=profile.id; addingProfile=false; showToast('프로필이 추가되었습니다.'); } state=normalizeState(state); saveState(); render(); }

    function header(title, backFn='', right=''){ return `<div class="header"><div class="head-slot">${backFn?`<button class="back" onclick="${backFn}">‹</button>`:''}</div><div class="title">${escapeHTML(title)}</div><div class="head-slot">${right}</div></div>`; }
    function nav(){ const items=[['home','⌂','오늘 기록'],['records','□','기록 보기'],['report','▥','리포트'],['settings','⚙','설정']]; return `<nav class="nav">${items.map(([k,i,l])=>`<button class="${view===k?'active':''}" onclick="go('${k}')"><div>${i}</div><div>${l}</div></button>`).join('')}</nav>`; }
    function appShell(content){ return `<div class="app">${content}${nav()}</div>`; }
    function profileChips(showAdd=false){ const selected=getSelectedProfile(); return `<div class="chips">${state.profiles.map(p=>`<button class="chip ${selected&&selected.id===p.id?'active':''}" onclick="selectProfile('${p.id}')">${avatarHTML(p,24)}<span>${escapeHTML(p.nickname)}</span></button>`).join('')}${showAdd?`<button class="chip" onclick="addingProfile=true; render();">+ 가족 추가</button>`:''}</div>`; }
    function inputHTML(id,label,value='',placeholder='',type='text'){ return `<label><span class="label">${label}</span><input id="${id}" class="input" type="${type}" value="${escapeAttr(value)}" placeholder="${escapeAttr(placeholder)}"></label>`; }
    function textareaHTML(id,label,value='',placeholder=''){ return `<label><span class="label">${label}</span><textarea id="${id}" class="textarea" placeholder="${escapeAttr(placeholder)}">${escapeHTML(value)}</textarea></label>`; }

    function render(){
      if(!state.onboardingCompleted){ $root.innerHTML = renderOnboarding(); return; }
      if(!state.profiles.length){ $root.innerHTML = renderProfileSetup({title:'프로필 생성', submitLabel:'저장', onSave:'first'}); bindProfileForm('first'); return; }
      if(addingProfile){ $root.innerHTML = renderProfileSetup({title:'가족 / 프로필 추가', submitLabel:'추가', onSave:'add', onCancel:true}); bindProfileForm('add'); return; }
      if(editingProfileId){ const p=state.profiles.find(x=>x.id===editingProfileId)||getSelectedProfile(); $root.innerHTML=renderProfileSetup({title:'프로필 수정', submitLabel:'수정 저장', onSave:'edit', onCancel:true, profile:p}); bindProfileForm('edit',p); return; }
      if(view==='form'){ $root.innerHTML=appShell(renderRecordForm()); bindRecordForm(); return; }
      if(detailId){ $root.innerHTML=appShell(renderDetail()); return; }
      if(view==='home') $root.innerHTML=appShell(renderHome());
      if(view==='records') $root.innerHTML=appShell(renderRecords());
      if(view==='report') $root.innerHTML=appShell(renderReport());
      if(view==='settings') $root.innerHTML=appShell(renderSettings());
    }

    function renderOnboarding(){ return `<div class="onboarding"><div class="box"><div class="center"><div class="logo">◇</div><div class="appname">스킨로그</div><p class="muted">병원에 보여주는 피부 기록장</p></div><div class="warning mt4"><b>사용 전 안내</b><br>이 앱은 피부 상태를 기록하고 진료 상담 시 참고하기 위한 도구입니다. 질병의 진단, 치료, 처방을 제공하지 않습니다.</div><button class="btn mt4" onclick="state.onboardingCompleted=true; saveState(); render();">시작하기</button><p class="tiny muted center mt3">정확한 진단과 치료는 의사 또는 의료 전문가와 상담해 주세요.</p></div></div>`; }

    function renderProfileSetup({title,submitLabel,onCancel=false,profile=null}){
      const type=profile?.type || 'child';
      return `<div class="app" style="padding-bottom:0">${header(title,onCancel?'addingProfile=false; editingProfileId=null; render();':'')}<div class="screen stack">
        <div class="grid2"><button id="typeSelf" class="seg ${type==='self'?'active':''}" type="button">${SELF_EMOJI} 본인</button><button id="typeChild" class="seg ${type==='child'?'active':''}" type="button">${CHILD_EMOJI} 아이</button></div>
        <section class="profile-photo-box"><p class="label">프로필 사진</p><div class="profile-photo-row"><span id="avatarPreview">${avatarHTML(profile||{type,avatarDataUrl:''},64)}</span><div><label class="btn outline small" style="width:auto;padding:0 14px">사진 업로드<input id="avatarInput" type="file" accept="image/*" class="hidden"></label><button id="avatarRemove" class="linkish tiny mt2" type="button">삭제</button><p class="tiny muted mt2">선택한 사진은 이름 옆 프로필 이미지로 표시됩니다.</p></div></div></section>
        ${inputHTML('pNickname','이름/별명',profile?.nickname||'','예) 지우')}
        ${inputHTML('pBirth','생년월일 또는 나이대',profile?.birthInfo||'','예) 2018.05 또는 7세')}
        ${textareaHTML('pMemo','피부질환 메모',profile?.skinMemo||'','예) 결절성 양진 치료 경험, 아토피 병력 등')}
        <button id="profileSubmit" class="btn">${submitLabel}</button>
      </div></div>`;
    }
    function bindProfileForm(mode, profile=null){
      let type=profile?.type || 'child'; let avatarDataUrl=profile?.avatarDataUrl || '';
      const updateType=()=>{ document.getElementById('typeSelf').classList.toggle('active',type==='self'); document.getElementById('typeChild').classList.toggle('active',type==='child'); updateAvatarPreview(); };
      const updateAvatarPreview=()=>{ const nick=document.getElementById('pNickname')?.value||'프로필'; document.getElementById('avatarPreview').innerHTML=avatarHTML({type,nickname:nick,avatarDataUrl},64); };
      document.getElementById('typeSelf').onclick=()=>{type='self'; updateType();};
      document.getElementById('typeChild').onclick=()=>{type='child'; updateType();};
      document.getElementById('pNickname').oninput=updateAvatarPreview;
      document.getElementById('avatarInput').onchange=(e)=>{ const file=e.target.files?.[0]; if(!file)return; const r=new FileReader(); r.onload=()=>{avatarDataUrl=String(r.result||''); updateAvatarPreview();}; r.readAsDataURL(file); e.target.value=''; };
      document.getElementById('avatarRemove').onclick=()=>{avatarDataUrl=''; updateAvatarPreview();};
      document.getElementById('profileSubmit').onclick=()=>{ const nickname=document.getElementById('pNickname').value.trim(); if(!nickname){alert('이름 또는 별명을 입력해 주세요.');return;} const newProfile={id:profile?.id||uid('profile'),type,nickname,birthInfo:document.getElementById('pBirth').value.trim(),skinMemo:document.getElementById('pMemo').value.trim(),avatarDataUrl,createdAt:profile?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()}; if(mode==='first'){state.profiles=[newProfile]; state.selectedProfileId=newProfile.id; saveState(); render();} else saveProfile(newProfile, mode==='edit'); };
    }

    function renderHome(){ const p=getSelectedProfile(); const selectedRecords=state.records.filter(r=>!p?.id||r.profileId===p.id); const sorted=[...selectedRecords].sort((a,b)=>new Date(b.recordedAt)-new Date(a.recordedAt)); const latest=sorted[0]; const last7=selectedRecords.filter(r=>withinDays(r.recordedAt,7)); const avgItch=average(last7.map(r=>r.symptoms.itchScore)); const med=latest?.medicines||'-'; return `${header('오늘 기록')}<div class="screen stack">${profileChips(true)}<div class="card" style="display:flex;gap:14px;align-items:center">${avatarHTML(p,64)}<div><div style="font-size:22px;font-weight:1000">${escapeHTML(p?.nickname||'프로필')}</div><div class="small muted mt1">최근 기록: ${daysAgoText(latest?.recordedAt)}</div><div class="chip mt2" style="display:inline-flex">상태: ${latest?(latest.symptoms.itchScore>=7||latest.symptoms.rednessScore>=7?'심한 편':'보통'):'기록 전'}</div></div></div><button class="btn" style="height:64px;font-size:18px" onclick="startNewRecord()">✎ 오늘 기록하기</button><div class="grid3"><div class="summary-card"><div class="tiny bold muted">최근 기록</div><div class="value">${latest?daysAgoText(latest.recordedAt):'없음'}</div><div class="tiny muted">${latest?formatDateOnly(latest.recordedAt):'-'}</div></div><div class="summary-card"><div class="tiny bold muted">가려움 평균</div><div class="value">${avgItch}</div><div class="tiny muted">최근 7일 / 10</div></div><div class="summary-card"><div class="tiny bold muted">최근 사용한 약</div><div class="value" style="font-size:16px">${escapeHTML(med.slice(0,8)||'-')}</div><div class="tiny muted">${med.length>8?'자세히 보기':''}</div></div></div><div class="card soft small"><b>v7 업데이트</b><br><span class="muted">프로필 여러 명 관리, 아침/점심/저녁/간식 기록, 프로필 사진 수정이 반영되었습니다.</span></div></div>`; }

    function renderRecordForm(){ if(!draft) draft=createEmptyRecord(getSelectedProfile()?.id||null); const p=getSelectedProfile(); const isEditing=formMode==='edit'; return `${header(isEditing?'기록 수정':'기록 작성','go(\'home\')')}<div class="screen stack"><div class="card soft small bold"><span style="display:inline-flex;align-items:center;gap:8px">현재 기록 대상: ${avatarHTML(p,24)} ${escapeHTML(p?.nickname||'프로필')}</span></div>${isEditing?`<div class="card soft small"><b>수정 모드</b><br><span class="muted">기존 기록을 불러왔습니다. 내용을 바꾼 뒤 아래의 수정 저장 버튼을 눌러주세요.</span></div>`:''}${inputHTML('recordedAt','기록 시간',draft.recordedAt,'','datetime-local')}<section><div style="display:flex;justify-content:space-between" class="mb2"><b>사진</b><span class="tiny muted">최대 10장</span></div><label class="photo-add">▧<span>+ 사진 추가</span><input id="photosInput" type="file" accept="image/*" multiple class="hidden"></label><div class="photo-grid mt3">${(draft.photos||[]).map(ph=>`<div class="photo-item"><img src="${escapeAttr(ph.dataUrl)}"><button class="photo-del" onclick="removeDraftPhoto('${ph.id}')">×</button></div>`).join('')}</div></section><section><p class="section-title">부위 선택</p><div class="grid4">${BODY_PARTS.map(part=>`<button class="part ${(draft.bodyParts||[]).includes(part.key)?'active':''}" onclick="toggleDraftPart('${part.key}')">${part.label}</button>`).join('')}</div></section><section class="stack"><p class="section-title">증상 점수</p>${scoreHTML('가려움','itchScore')}${scoreHTML('붉음','rednessScore')}${scoreHTML('진물','oozeScore')}${scoreHTML('각질','scaleScore')}${scoreHTML('긁음','scratchScore')}</section>${inputHTML('medicines','오늘 사용한 약 / 보습제',draft.medicines||'','예) 보습제, 스테로이드 연고')}<section class="stack"><p class="section-title">음식 기록</p>${inputHTML('foodBreakfast','아침',draft.food?.breakfast||'','예) 밥, 계란, 우유')}${inputHTML('foodLunch','점심',draft.food?.lunch||'','예) 어린이집 식단, 빵, 과일')}${inputHTML('foodDinner','저녁',draft.food?.dinner||'','예) 고기, 국, 면')}${inputHTML('foodSnack','간식 / 특이 음식',draft.food?.snack||draft.foodMemo||'','예) 딸기, 초콜릿, 과자')}</section><label><span class="label">수면 상태</span><select id="sleepStatus" class="select">${SLEEP_OPTIONS.map(o=>`<option value="${o.key}" ${draft.sleepStatus===o.key?'selected':''}>${o.label}</option>`).join('')}</select></label>${textareaHTML('note','메모',draft.note||'','예) 밤에 가려워서 자주 깸')}<button class="btn" onclick="submitRecordForm()">✓ ${isEditing?'수정 저장':'기록 저장'}</button></div>`; }
    function scoreHTML(label,key){ const val=draft.symptoms?.[key]||0; return `<div class="score"><div class="score-row"><b>${label}</b><span class="score-badge" id="badge_${key}">${val} / 10</span></div><input class="range" type="range" min="0" max="10" value="${val}" oninput="draft.symptoms['${key}']=clampScore(this.value); document.getElementById('badge_${key}').textContent=this.value+' / 10';"><div style="display:flex;justify-content:space-between" class="tiny muted"><span>없음</span><span>심함</span></div></div>`; }
    function bindRecordForm(){ document.getElementById('photosInput').onchange=handlePhotos; }
    function syncDraftFields(){ draft.recordedAt=document.getElementById('recordedAt').value; draft.medicines=document.getElementById('medicines').value; draft.food={breakfast:document.getElementById('foodBreakfast').value,lunch:document.getElementById('foodLunch').value,dinner:document.getElementById('foodDinner').value,snack:document.getElementById('foodSnack').value}; draft.foodMemo=draft.food.snack; draft.sleepStatus=document.getElementById('sleepStatus').value; draft.note=document.getElementById('note').value; draft.updatedAt=new Date().toISOString(); }
    function submitRecordForm(){ syncDraftFields(); if(!draft.bodyParts.length){alert('부위를 하나 이상 선택해 주세요.'); return;} saveRecord(draft); }
    window.toggleDraftPart=(key)=>{ const exists=draft.bodyParts.includes(key); draft.bodyParts=exists?draft.bodyParts.filter(x=>x!==key):[...draft.bodyParts,key]; render(); };
    window.removeDraftPhoto=(id)=>{ draft.photos=draft.photos.filter(p=>p.id!==id); render(); };
    async function handlePhotos(e){ const remaining=PHOTO_LIMIT-draft.photos.length; if(remaining<=0){alert(`사진은 최대 ${PHOTO_LIMIT}장까지 추가할 수 있어요.`); return;} const files=Array.from(e.target.files||[]).slice(0,remaining); if((e.target.files||[]).length>remaining) alert(`사진은 최대 ${PHOTO_LIMIT}장까지 저장됩니다. 초과한 사진은 제외했어요.`); const images=await Promise.all(files.map(file=>new Promise(resolve=>{const r=new FileReader(); r.onload=()=>resolve({id:uid('photo'),name:file.name,dataUrl:r.result}); r.readAsDataURL(file);}))); draft.photos=[...draft.photos,...images].slice(0,PHOTO_LIMIT); e.target.value=''; render(); }

    function renderRecords(){ const p=getSelectedProfile(); const sorted=[...state.records].filter(r=>!p?.id||r.profileId===p.id).sort((a,b)=>new Date(b.recordedAt)-new Date(a.recordedAt)); const filter=window.__recordFilter||'all'; const filtered=sorted.filter(r=>filter==='severe'?(r.symptoms.itchScore>=7||r.symptoms.rednessScore>=7):filter==='medicine'?Boolean((r.medicines||'').trim()):true); const days={}; sorted.forEach(r=>{const d=new Date(r.recordedAt); if(!isNaN(d))days[d.getDate()]=true;}); return `${header('기록 보기','',`<button class="iconbtn" onclick="startNewRecord()">+</button>`)}<div class="screen stack">${profileChips(false)}<div class="card soft small bold"><span style="display:inline-flex;align-items:center;gap:8px">현재 보기 대상: ${avatarHTML(p,24)} ${escapeHTML(p?.nickname||'프로필')}</span></div><div class="chips">${[['all','전체'],['severe','심한 날'],['medicine','약 사용']].map(([k,l])=>`<button class="chip ${filter===k?'active':''}" onclick="window.__recordFilter='${k}'; render();">${l}</button>`).join('')}</div><div class="card"><div class="center bold mb2">이번 달 기록 캘린더</div><div class="calendar">${['일','월','화','수','목','금','토'].map(d=>`<div class="tiny bold muted">${d}</div>`).join('')}${Array.from({length:35}).map((_,i)=>{const day=i+1;return `<div class="day ${days[day]?'mark':''}"><span>${day<=31?day:''}</span></div>`}).join('')}</div></div><div class="stack">${filtered.length?filtered.map(r=>recordRow(r)).join(''):`<div class="empty"><b>기록이 없습니다</b><p class="small muted">오늘 기록하기 버튼으로 첫 기록을 남겨보세요.</p></div>`}</div></div>`; }
    function recordRow(r){ return `<button class="record-row" onclick="detailId='${r.id}'; render();"><div class="thumb">${r.photos?.[0]?.dataUrl?`<img src="${escapeAttr(r.photos[0].dataUrl)}">`:'▧'}</div><div style="flex:1;min-width:0"><div class="bold">${formatDateTime(r.recordedAt)}</div><div class="small muted mt1">${(r.bodyParts||[]).map(bodyPartLabel).join(', ')||'부위 없음'}</div><div class="tiny muted mt1">가려움 ${r.symptoms.itchScore} · 붉음 ${r.symptoms.rednessScore}</div></div><div class="muted">›</div></button>`; }

    function renderDetail(){ const r=state.records.find(x=>x.id===detailId); if(!r){detailId=null;return renderRecords();} const p=state.profiles.find(x=>x.id===r.profileId)||getSelectedProfile(); return `${header('기록 상세','detailId=null; render();',`<button class="iconbtn" onclick="editRecordById('${r.id}')">✎</button>`)}<div class="screen stack"><div class="card" style="padding:0;overflow:hidden">${r.photos?.[0]?.dataUrl?`<img src="${escapeAttr(r.photos[0].dataUrl)}" style="width:100%;max-height:420px;object-fit:cover;display:block">`:`<div style="height:220px;display:flex;align-items:center;justify-content:center;color:#94a3b8;flex-direction:column">▧<div class="small">등록된 사진 없음</div></div>`}</div>${r.photos?.length>1?`<div class="photo-grid">${r.photos.slice(1).map(ph=>`<div class="photo-item"><img src="${escapeAttr(ph.dataUrl)}"></div>`).join('')}</div>`:''}<div class="card"><div class="bold">${formatDateTime(r.recordedAt)}</div><div class="small muted mt2" style="display:flex;align-items:center;gap:8px">대상: ${avatarHTML(p,24)} ${escapeHTML(p?.nickname||'-')}</div><div class="small muted mt2">부위: ${(r.bodyParts||[]).map(bodyPartLabel).join(', ')}</div></div><div class="grid5">${[['가려움','itchScore'],['붉음','rednessScore'],['진물','oozeScore'],['각질','scaleScore'],['긁음','scratchScore']].map(([l,k])=>`<div class="mini"><div class="tiny bold muted">${l}</div><div class="n">${r.symptoms[k]||0}</div></div>`).join('')}</div>${infoBlock('사용한 약 / 보습제',r.medicines||'-')}${infoBlock('음식 기록',[`아침: ${r.food?.breakfast||'-'}`,`점심: ${r.food?.lunch||'-'}`,`저녁: ${r.food?.dinner||'-'}`,`간식/특이 음식: ${r.food?.snack||r.foodMemo||'-'}`].join('\n'))}${infoBlock('수면',sleepLabel(r.sleepStatus))}${infoBlock('기타 메모',r.note||'-')}<button class="btn outline" onclick="editRecordById('${r.id}')">✎ 기록 수정하기</button><button class="btn outline danger" onclick="deleteRecord('${r.id}')">× 기록 삭제</button></div>`; }
    window.editRecordById=(id)=>{ const r=state.records.find(x=>x.id===id); if(r) editRecord(r); };
    function infoBlock(title,content){ return `<div class="card"><div class="bold small">${title}</div><div class="small muted mt2" style="white-space:pre-wrap;line-height:1.6">${escapeHTML(content)}</div></div>`; }

    function renderReport(){ const p=getSelectedProfile(); const range=window.__reportRange||7; const records=state.records.filter(r=>(!p?.id||r.profileId===p.id)&&withinDays(r.recordedAt,range)); const s=buildReport(records); return `${header('병원 리포트')}<div class="screen stack">${profileChips(false)}<div class="card soft small bold"><span style="display:inline-flex;align-items:center;gap:8px">현재 리포트 대상: ${avatarHTML(p,24)} ${escapeHTML(p?.nickname||'프로필')}</span></div><div class="grid2" style="background:#f1f5f9;padding:4px;border-radius:22px"><button class="seg ${range===7?'active':''}" onclick="window.__reportRange=7; render();">최근 7일</button><button class="seg ${range===30?'active':''}" onclick="window.__reportRange=30; render();">최근 30일</button></div><div class="report-grid">${reportCard('기록 횟수',`${s.recordCount}회`,`최근 ${range}일`)}${reportCard('가려움 평균',s.avgItch,'/ 10')}${reportCard('붉음 평균',s.avgRedness,'/ 10')}${reportCard('가장 심했던 날',s.worstRecord?formatDateOnly(s.worstRecord.recordedAt):'-',s.worstScore?`기록 점수 ${s.worstScore}`:'')}</div><div class="card"><b>많이 기록된 부위</b><p class="small muted">${s.topParts.length?s.topParts.map(x=>`${bodyPartLabel(x.key)} ${x.count}회`).join(' · '):'기록 없음'}</p></div><div class="card"><b>사진 변화</b><div class="compare mt3">${compareItem('첫 기록',s.firstPhotoRecord)}<span class="muted">→</span>${compareItem('최근 기록',s.lastPhotoRecord)}</div></div>${textareaHTML('guardianMemo','보호자 메모',window.__guardianMemo||'','병원에 전달하고 싶은 내용을 입력하세요.')}<div class="grid2"><button class="btn" onclick="exportReportText()">⇩ TXT 저장</button><button class="btn outline" onclick="exportReportJson()">▤ JSON 저장</button></div></div>`; }
    function buildReport(records){ const recordCount=records.length; const avgItch=average(records.map(r=>r.symptoms.itchScore)); const avgRedness=average(records.map(r=>r.symptoms.rednessScore)); const scored=records.map(r=>({record:r,score:(r.symptoms.itchScore||0)+(r.symptoms.rednessScore||0)+(r.symptoms.scratchScore||0)})).sort((a,b)=>b.score-a.score); const counts={}; records.forEach(r=>(r.bodyParts||[]).forEach(p=>counts[p]=(counts[p]||0)+1)); const topParts=Object.entries(counts).map(([key,count])=>({key,count})).sort((a,b)=>b.count-a.count).slice(0,3); const withPhotos=records.filter(r=>r.photos?.length).sort((a,b)=>new Date(a.recordedAt)-new Date(b.recordedAt)); return {recordCount,avgItch,avgRedness,worstRecord:scored[0]?.record||null,worstScore:scored[0]?.score||0,topParts,firstPhotoRecord:withPhotos[0]||null,lastPhotoRecord:withPhotos[withPhotos.length-1]||null}; }
    function reportCard(t,v,s){ return `<div class="summary-card"><div class="tiny bold muted">${t}</div><div class="value">${escapeHTML(v)}</div><div class="tiny muted">${escapeHTML(s)}</div></div>`; }
    function compareItem(label,r){ return `<div class="center"><div class="compare-img">${r?.photos?.[0]?.dataUrl?`<img src="${escapeAttr(r.photos[0].dataUrl)}">`:'▧'}</div><div class="tiny bold muted mt2">${label}</div><div class="tiny muted">${r?formatDateOnly(r.recordedAt):'-'}</div></div>`; }
    function makeReportText(){ const p=getSelectedProfile(); const range=window.__reportRange||7; const records=state.records.filter(r=>(!p?.id||r.profileId===p.id)&&withinDays(r.recordedAt,range)); const s=buildReport(records); const memo=document.getElementById('guardianMemo')?.value || window.__guardianMemo || ''; return ['스킨로그 병원 리포트','====================',`프로필: ${p?.nickname||'-'}`,`기간: 최근 ${range}일`,`기록 횟수: ${s.recordCount}회`,`가려움 평균: ${s.avgItch} / 10`,`붉음 평균: ${s.avgRedness} / 10`,`가장 심했던 날: ${s.worstRecord?formatDateTime(s.worstRecord.recordedAt):'-'}`,`많이 기록된 부위: ${s.topParts.length?s.topParts.map(x=>`${bodyPartLabel(x.key)} ${x.count}회`).join(', '):'-'}`,'','보호자 메모',memo||'-','','기록 목록',...records.map((r,i)=>`${i+1}. ${formatDateTime(r.recordedAt)} / 부위: ${(r.bodyParts||[]).map(bodyPartLabel).join(', ')} / 가려움 ${r.symptoms.itchScore}, 붉음 ${r.symptoms.rednessScore}, 긁음 ${r.symptoms.scratchScore} / 약: ${r.medicines||'-'} / 아침: ${r.food?.breakfast||'-'}, 점심: ${r.food?.lunch||'-'}, 저녁: ${r.food?.dinner||'-'}, 간식: ${r.food?.snack||r.foodMemo||'-'} / 메모: ${r.note||'-'}`),'','면책 문구: 이 자료는 사용자가 입력한 기록을 요약한 것이며, 의학적 진단이나 치료 판단을 제공하지 않습니다.'].join('\n'); }
    function exportReportText(){ window.__guardianMemo=document.getElementById('guardianMemo')?.value||''; downloadTextFile(`skinlog-report-${window.__reportRange||7}days.txt`, makeReportText(), 'text/plain;charset=utf-8'); }
    function exportReportJson(){ const p=getSelectedProfile(); const range=window.__reportRange||7; const records=state.records.filter(r=>(!p?.id||r.profileId===p.id)&&withinDays(r.recordedAt,range)); const summary=buildReport(records); const guardianMemo=document.getElementById('guardianMemo')?.value||''; downloadTextFile(`skinlog-report-${range}days.json`, JSON.stringify({app:'스킨로그 MVP',version:VERSION_LABEL,exportedAt:new Date().toISOString(),profile:p,range:`${range}일`,summary,guardianMemo,records,disclaimer:'이 자료는 사용자가 입력한 기록을 요약한 것이며, 의학적 진단이나 치료 판단을 제공하지 않습니다.'},null,2),'application/json'); }

    function renderSettings(){ const p=getSelectedProfile(); return `${header('설정')}<div class="screen stack"><div class="card"><div class="small bold muted">현재 프로필</div><div class="mt2" style="display:flex;align-items:center;gap:12px">${avatarHTML(p,56)}<div style="font-size:24px;font-weight:1000">${escapeHTML(p?.nickname||'-')}</div></div><div class="small muted mt2">${p?.type==='child'?'아이':'본인'} · ${escapeHTML(p?.birthInfo||'나이대 미입력')}</div>${p?.skinMemo?`<div class="small muted mt3" style="line-height:1.6">${escapeHTML(p.skinMemo)}</div>`:''}<div class="pill-list mt4">${state.profiles.map(profile=>`<button class="pill ${p&&p.id===profile.id?'active':''}" onclick="selectProfile('${profile.id}')">${avatarHTML(profile,24)}<span>${escapeHTML(profile.nickname)}</span></button>`).join('')}</div><div class="grid2 mt4"><button class="btn outline small" onclick="editingProfileId='${p?.id||''}'; render();">현재 프로필 수정</button><button class="btn outline small" onclick="addingProfile=true; render();">+ 가족 / 프로필 추가</button></div></div><div class="card" style="padding:0;overflow:hidden">${settingsRow('☰','기록 항목 설정','현재는 기본 항목 사용')}${settingsRow('◇','의료 면책 문구','진단·치료·처방 기능 없음')}${settingsRow('▤','테스트 버전',VERSION_LABEL)}</div><div class="card"><b>데이터 백업</b><p class="small muted" style="line-height:1.6">한 번 입력한 프로필과 기록은 같은 기기·브라우저·URL에서 유지됩니다. 브라우저 데이터 삭제 또는 기기 변경 시 기록이 사라질 수 있으니 중요한 기록은 백업해 주세요.</p><div class="grid2 mt3"><button class="btn small" onclick="exportAll()">백업 저장</button><label class="btn outline small">백업 불러오기<input id="importFile" type="file" accept="application/json" class="hidden"></label></div></div><div class="card soft tiny muted"><b>개인정보 안내</b><br>이 프로토타입은 회원가입 없이 사용하며, 입력한 기록은 현재 브라우저 저장소에 저장됩니다. 개발자 서버로 자동 전송하지 않습니다.</div><button class="btn outline danger" onclick="resetAll()">모든 데이터 삭제</button></div>`; }
    function settingsRow(i,t,d){ return `<div class="settings-row"><div class="avatar" style="width:40px;height:40px">${i}</div><div style="flex:1"><div class="bold">${t}</div><div class="tiny muted mt1">${d}</div></div><div class="muted">›</div></div>`; }
    function exportAll(){ downloadTextFile(`skinlog-backup-${Date.now()}.json`, JSON.stringify(normalizeState(state),null,2), 'application/json'); }
    function bindImportIfNeeded(){ const f=document.getElementById('importFile'); if(!f) return; f.onchange=e=>{ const file=e.target.files?.[0]; if(!file)return; const reader=new FileReader(); reader.onload=()=>{ try{ const parsed=JSON.parse(String(reader.result)); state=normalizeState(parsed); saveState(); alert('백업 데이터를 불러왔습니다.'); render(); }catch{ alert('백업 파일을 읽을 수 없습니다.'); } }; reader.readAsText(file); e.target.value=''; }; }
    function resetAll(){ if(!confirm('모든 데이터를 삭제할까요? 이 작업은 되돌릴 수 없습니다.'))return; state={...DEFAULT_STATE}; localStorage.removeItem(STORAGE_KEY); view='home'; render(); }
    function downloadTextFile(filename, content, type){ const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }

    const origRender = render;
    render = function(){ origRender(); bindImportIfNeeded(); };
    render();
  </script>
</body>
</html>
