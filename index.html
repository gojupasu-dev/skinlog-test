<script>
const APP_NAME='SootheNote', APP_TAG='우리 가족 피부 기록장', APP_SUB='피부 변화를 차분히 기록해요';
const KEY='skinlog_mvp_v1', LEGACY_KEYS=['skinlog_mvp_v1','soothenote_app_v1','soothenote_v10','soothenote_test'], DB_NAME='soothenote_local_db', DB_STORE='app_state', DB_STATE_KEY='state_v1', VERSION='v10-calendar-holiday-names';

function openDb(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error('IndexedDB unavailable'));return}
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('IndexedDB open failed'));
  });
}
async function readDb(){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,'readonly'), st=tx.objectStore(DB_STORE), req=st.get(DB_STATE_KEY);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error||new Error('IndexedDB read failed'));
    tx.oncomplete=()=>db.close();
  });
}
async function writeDb(data){
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,'readwrite'), st=tx.objectStore(DB_STORE);
    st.put(norm(data),DB_STATE_KEY);
    tx.oncomplete=()=>{db.close();resolve(true)};
    tx.onerror=()=>{db.close();reject(tx.error||new Error('IndexedDB write failed'))};
  });
}
async function deleteDbState(){
  try{
    const db=await openDb();
    await new Promise((resolve,reject)=>{

async function load(){
  try{
    const dbState=await readDb();
    if(dbState){state=norm(dbState);return}
  }catch(e){console.warn('IndexedDB 불러오기 실패',e)}
  try{
    for(const k of LEGACY_KEYS){
      const raw=localStorage.getItem(k);
      if(raw){state=norm(JSON.parse(raw));writeDb(state).catch(()=>{});break;}
    }
  }catch(e){}
}
function save(){

function compressImageFile(file,{maxSize=1280,quality=.72}={}){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type||!file.type.startsWith('image/')){reject(new Error('이미지 파일이 아닙니다.'));return}
    const reader=new FileReader();
    reader.onerror=()=>reject(reader.error||new Error('사진을 읽지 못했습니다.'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('사진을 불러오지 못했습니다.'));
      img.onload=()=>{
        const scale=Math.min(1,maxSize/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.src=String(reader.result||'');
    };
    reader.readAsDataURL(file);
  });
}

function nav(){return `<div class="tabs">${[['home','오늘 기록','edit'],['records','기록 보기','calendar'],['report','리포트','chart'],['settings','설정','settings']].map(x=>`<button class="tab ${tab===x[0]?'active':''}" onclick="window.scrollTo(0,0);tab='${x[0]}';detailId=null;draft=null;render()">${icon(x[2])}<span>${x[1]}</span></button>`).join('')}</div>`}
function header(e,t,act=''){return `<div class="title-row"><div><p class="eyebrow">${e}</p><h1 class="h1">${t}</h1></div>${act}</div>`}
function chips(add=false){let s=`<div class="chips">${state.profiles.map(p=>`<button class="chip ${p.id===state.selectedProfileId?'active':''}" onclick="state.selectedProfileId='${p.id}';render()">${avatar(p)}<span>${esc(p.nickname)}</span></button>`).join('')}`; if(add)s+=`<button class="chip" onclick="addProfile=true;render()">+ 가족 추가</button>`; return s+'</div>'}
function view(){if(draft)return form(); if(detailId)return detail(); if(tab==='home')return home(); if(tab==='records')return records(); if(tab==='report')return report(); return settings()}
function selectedRecords(){let p=prof(); return state.records.filter(x=>!p||x.profileId===p.id).sort((a,b)=>new Date(b.recordedAt)-new Date(a.recordedAt))}
function home(){let p=prof(), rec=selectedRecords(), latest=rec[0], last7=rec.filter(x=>within(x.recordedAt,7));return `<div class="screen">${header('Today','오늘 기록')}${chips(true)}<section class="card p20" style="margin-top:20px"><div class="home-summary">${avatar(p,70)}<div class="home-summary-copy"><p class="lead">오늘 ${esc(p?.nickname||'가족')} 피부 상태를 기록해볼까요?</p><h2 class="headline">${latest&&(latest.symptoms.itchScore>=7||latest.symptoms.scratchScore>=7)?'조금 더 살펴봐요':latest?'차분히 기록해볼까요?':'첫 기록을 남겨볼까요?'}</h2><p class="sub">마지막 기록: ${ago(latest?.recordedAt)}</p></div></div></section><div class="grid2" style="margin-top:16px"><button class="card p20" style="text-align:left;background:#eff6ff;color:#1d4ed8" onclick="newRec('quick')"><div class="icon-btn" style="color:#3b82f6;background:#f8fbff;border-color:#edf2f7;box-shadow:none;margin-bottom:14px">${icon('edit')}</div><b>빠르게 남기기</b><p class="small" style="margin:6px 0 0">사진·부위·가려움·긁음</p></button><button class="card p20" style="text-align:left" onclick="newRec('detail')"><div class="icon-btn" style="color:#3b82f6;background:#f8fbff;border-color:#edf2f7;box-shadow:none;margin-bottom:14px">${icon('file')}</div><b>자세히 남기기</b><p class="small muted" style="margin:6px 0 0">약·음식·수면·메모까지</p></button></div><section class="card p20" style="margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:18px">최근 상태</h2><span class="pill" style="background:#eff6ff;color:#2563eb">최근 7일</span></div><div class="grid3" style="margin-top:14px"><div class="pill orange" style="display:block;text-align:center">가려움<br><b>${avg(last7.map(x=>x.symptoms.itchScore))}</b></div><div class="pill rose" style="display:block;text-align:center">긁음<br><b>${avg(last7.map(x=>x.symptoms.scratchScore))}</b></div><div class="pill" style="display:block;text-align:center;background:#eff6ff;color:#2563eb">기록<br><b>${last7.length}회</b></div></div><div style="margin-top:14px;background:#f8fafc;border-radius:16px;padding:14px"><p class="small muted" style="margin:0">최근 사용한 약 / 보습제</p><b>${esc(latest?.medicines||'아직 기록 없음')}</b></div></section>${weeklyCard()}</div>`}
function emptyRecord(mode='detail'){return{id:uid('record'),profileId:prof()?.id,recordMode:mode,symptomKeys:mode==='quick'?['itchScore','scratchScore']:['itchScore','rednessScore','oozeScore','scaleScore','scratchScore'],recordedAt:nowVal(),bodyParts:[],photos:[],partPhotos:ensurePartPhotoMap(),symptoms:{itchScore:0,rednessScore:0,oozeScore:0,scaleScore:0,scratchScore:0},medicines:'',food:{breakfast:'',lunch:'',dinner:'',snack:''},foodMemo:'',sleepStatus:'',note:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}}
function newRec(mode){formMode=mode;draft=emptyRecord(mode==='quick'?'quick':'detail');tab='form';window.scrollTo(0,0);render()}

function togglePart(part){
  if(!draft) return;
  draft.partPhotos=ensurePartPhotoMap(draft.partPhotos||{});
  if(draft.bodyParts.includes(part)){
    draft.bodyParts=draft.bodyParts.filter(x=>x!==part);
  }else{
    draft.bodyParts=[...draft.bodyParts,part];
    draft.partPhotos[part]=draft.partPhotos[part]||[];
  }
  draft.photos=flattenPartPhotos(draft.partPhotos).slice(0,20);
  draft.updatedAt=new Date().toISOString();
  render();
}
function score(label,key){
  const v=draft?.symptoms?.[key]??0;

}

  <h3 style="margin-top:18px">음식 기록</h3>
  <div class="field"><label class="label">아침</label><input class="input" value="${esc(draft.food?.breakfast||'')}" placeholder="예) 밥, 계란, 우유" onchange="draft.food={...(draft.food||{}),breakfast:this.value}"></div>
  <div class="field"><label class="label">점심</label><input class="input" value="${esc(draft.food?.lunch||'')}" placeholder="예) 어린이집 식단, 빵, 과일" onchange="draft.food={...(draft.food||{}),lunch:this.value}"></div>
  <div class="field"><label class="label">저녁</label><input class="input" value="${esc(draft.food?.dinner||'')}" placeholder="예) 고기, 국, 면" onchange="draft.food={...(draft.food||{}),dinner:this.value}"></div>
  <div class="field"><label class="label">간식 / 특이 음식</label><input class="input" value="${esc(draft.food?.snack||draft.foodMemo||'')}" placeholder="예) 딸기, 초콜릿, 과자" onchange="draft.food={...(draft.food||{}),snack:this.value};draft.foodMemo=this.value"></div>
  <div class="field"><label class="label">수면 상태</label><select class="input" onchange="draft.sleepStatus=this.value"><option value="" ${!draft.sleepStatus?'selected':''}>선택 안 함</option><option value="good" ${draft.sleepStatus==='good'?'selected':''}>좋음</option><option value="normal" ${draft.sleepStatus==='normal'?'selected':''}>보통</option><option value="bad" ${draft.sleepStatus==='bad'?'selected':''}>나쁨</option></select></div>
  <div class="field"><label class="label">메모</label><textarea class="textarea" placeholder="예) 밤에 가려워서 자주 깸" onchange="draft.note=this.value">${esc(draft.note||'')}</textarea></div>`;

function form(){let quick=formMode==='quick', edit=!!state.records.find(x=>x.id===draft.id);draft.partPhotos=ensurePartPhotoMap(draft.partPhotos||{});let totalPhotos=flattenPartPhotos(draft.partPhotos).length;return `<div class="screen" style="padding-bottom:170px"><div style="display:flex;gap:12px;align-items:center;margin-bottom:22px"><button class="icon-btn" onclick="draft=null;render()">${icon('back')}</button><div><p class="eyebrow">${edit?'Edit':quick?'Quick':'Detail'}</p><h1 class="h1">${edit?'기록 수정':quick?'빠른 기록':'상세 기록'}</h1></div></div><div class="card p16" style="margin-bottom:16px"><div class="target-row"><span class="label">현재 기록 대상:</span>${avatar(prof(),24)}<span class="target-name">${esc(prof()?.nickname||'')}</span></div></div><button class="btn btn-soft" onclick="loadPrev()" style="margin-bottom:16px;width:100%">이전 기록 불러오기</button><div class="field"><label class="label">기록 시간 (자동 입력)</label><input class="input" type="datetime-local" value="${draft.recordedAt}" onchange="draft.recordedAt=this.value"></div><h3>부위 선택</h3><p class="small muted" style="margin-top:-6px;margin-bottom:12px">사진을 부위별로 저장하면 기록 상세와 리포트에서 더 깔끔하게 비교할 수 있어요.</p><div class="part-grid">${BODY.map(x=>`<button class="part ${draft.bodyParts.includes(x[0])?'active':''}" onclick="togglePart('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="small muted" style="margin-top:8px">전체 사진 ${totalPhotos} / 20장</div>${draft.bodyParts.length?`<div style="display:grid;gap:14px;margin-top:14px">${draft.bodyParts.map(part=>`<section class="card p16"><div class="part-photo-head"><div><b>${label(part)}</b><p class="small muted" style="margin-top:4px">부위별 최대 4장</p></div><span class="small muted">${getPartPhotos(draft,part).length}장</span></div><input id="part-file-${part}" class="hidden-picker" type="file" accept="image/*" multiple onchange="addPartPhotos('${part}',this.files);this.value=''">${getPartPhotos(draft,part).length?`<div class="part-photo-grid">${getPartPhotos(draft,part).map(p=>`<div class="photo-thumb"><img src="${p.dataUrl}"><button style="position:absolute;right:4px;top:4px;background:white;border-radius:50%;width:22px;height:22px" onclick="removePartPhoto('${part}','${p.id}')">×</button></div>`).join('')}</div>${getPartPhotos(draft,part).length<4?`<label for="part-file-${part}" class="part-photo-addbtn"><span class="plus">+</span><span>사진 추가</span></label>`:''}<p class="soft-note part-photo-note">사진을 누르면 나중에 상세 화면과 리포트에서 부위별 비교가 가능해요.</p>`:`<label for="part-file-${part}" class="photo-box part-photo-empty" style="margin-top:12px"><span class="photo-icon">${icon('image')}</span><span class="main">사진이 아직 없어요</span><span class="sub">눌러서 사진을<br>추가해 주세요</span></label>`}</section>`).join('')}</div>`:`<div class="card p16" style="margin-top:14px;text-align:center;color:#64748b">먼저 부위를 선택하면 해당 부위별 사진을 추가할 수 있어요.</div>`}<h3 style="margin-top:20px">증상 점수</h3>${score('가려움','itchScore')}${quick?score('긁음','scratchScore'):`${score('붉음','rednessScore')}${score('진물','oozeScore')}${score('각질','scaleScore')}${score('긁음','scratchScore')}`}${quick?`<details class="card p16" style="margin-top:16px"><summary style="font-weight:650">약·음식·수면·메모 추가</summary>${extra()}</details>`:extra()}<div class="fixed-save"><button class="btn btn-soft save-soft" style="width:100%" onclick="saveRec()">${edit?'수정 저장':quick?'빠른 기록 저장':'상세 기록 저장'}</button></div></div>`}
async function addPartPhotos(partKey,files){
  if(!draft || !partKey) return;
  draft.partPhotos=ensurePartPhotoMap(draft.partPhotos||{});
  const current=draft.partPhotos[partKey]||[];
  const total=flattenPartPhotos(draft.partPhotos).length;
  const remaining=Math.max(0,Math.min(4-current.length,20-total));
  const selected=[...files].slice(0,remaining);
  if(!selected.length){
    alert('사진은 전체 최대 20장, 부위별 최대 4장까지 추가할 수 있어요.');
    return;
  }
  try{
    const imgs=await Promise.all(selected.map(async f=>({
      id:uid('photo'),
      partKey,
      dataUrl:await compressImageFile(f,{maxSize:1280,quality:.72}),
      name:f.name,
      originalSize:f.size
    })));
    draft.partPhotos[partKey]=[...current,...imgs].slice(0,4);
    draft.photos=flattenPartPhotos(draft.partPhotos).slice(0,20);
    draft.updatedAt=new Date().toISOString();
    render();
  }catch(e){
    console.warn('사진 압축 실패',e);
    alert('사진을 저장하기 어려웠습니다. 용량이 작은 사진으로 다시 시도해 주세요.');
  }
}
function removePartPhoto(partKey,photoId){
  if(!draft || !partKey) return;
  draft.partPhotos=ensurePartPhotoMap(draft.partPhotos||{});
  draft.partPhotos[partKey]=(draft.partPhotos[partKey]||[]).filter(ph=>ph.id!==photoId);
  draft.photos=flattenPartPhotos(draft.partPhotos).slice(0,20);
  draft.updatedAt=new Date().toISOString();
  render();
}

function addPhotos(files){ const first=draft?.bodyParts?.[0]||BODY[0][0]; addPartPhotos(first,files); }
function loadPrev(){let last=selectedRecords()[0];if(!last)return alert('불러올 이전 기록이 없습니다.');draft={...draft,bodyParts:[...last.bodyParts],symptoms:{...draft.symptoms,...last.symptoms},medicines:last.medicines||'',food:{breakfast:last.food?.breakfast||'',lunch:last.food?.lunch||'',dinner:last.food?.dinner||'',snack:last.food?.snack||last.foodMemo||''},foodMemo:last.foodMemo||'',sleepStatus:last.sleepStatus||'',note:last.note||''};alert('이전 기록을 불러왔습니다. 사진과 기록 시간은 새 기록 기준으로 유지됩니다.');render()}
function openDetail(id){detailId=id;window.scrollTo(0,0);render()}
function editRec(id){
  const rec=state.records.find(x=>x.id===id);
  if(!rec){alert('수정할 기록을 찾지 못했습니다.');return}
  const mode=rec.recordMode==='quick'?'quick':'detail';
  formMode=mode;
  draft=JSON.parse(JSON.stringify(norm({records:[rec],profiles:state.profiles,selectedProfileId:state.selectedProfileId}).records[0]));
  draft.recordMode=mode;
  draft.symptomKeys=draft.symptomKeys||(mode==='quick'?['itchScore','scratchScore']:['itchScore','rednessScore','oozeScore','scaleScore','scratchScore']);
  detailId=null;
  tab='form';
  window.scrollTo(0,0);
  render();
}
function saveRec(){if(!draft.bodyParts.length)return alert('부위를 하나 이상 선택해 주세요.');draft.partPhotos=ensurePartPhotoMap(draft.partPhotos||{});draft.photos=flattenPartPhotos(draft.partPhotos);let i=state.records.findIndex(x=>x.id===draft.id);draft.updatedAt=new Date().toISOString(); if(i>=0)state.records[i]=draft; else state.records.unshift(draft); save(); toast=i>=0?'기록이 수정되었습니다.':'기록이 저장되었습니다.'; draft=null; tab='records'; setTimeout(()=>{toast='';render()},1800); render()}
function records(){let [y,m]=parseYM(calMonth), all=selectedRecords(), info=calInfo(y,m,all), month=all.filter(r=>{let d=new Date(r.recordedAt);return d.getFullYear()===y&&d.getMonth()===m}), list=month.filter(r=>filter==='severe'?isSevere(r):filter==='medicine'?!!r.medicines?.trim():true);return `<div class="screen">${header('Records','기록 보기')}${chips(false)}<div class="chips" style="margin-top:16px">${[['all','전체'],['severe','심한 날'],['medicine','약 사용']].map(x=>`<button class="chip ${filter===x[0]?'active':''}" onclick="filter='${x[0]}';render()">${x[1]}</button>`).join('')}</div><section class="card month-card" style="margin-top:16px"><div style="display:flex;justify-content:space-between"><div><button style="font-size:20px;font-weight:700" onclick="showPicker=!showPicker;render()">${y}년 ${m+1}월 ⌄</button><p class="muted" style="font-weight:500"><span style="display:inline-block;width:8px;height:8px;background:#3b82f6;border-radius:50%"></span> 기록 ${month.length}건</p><div class="legend"><span style="color:#ef4444">일요일·공휴일</span><span style="color:#cbd5e1">·</span><span style="color:#2563eb">토요일</span></div></div><div><button onclick="moveMonth(-1)" style="font-size:26px;color:#cbd5e1">‹</button><button onclick="moveMonth(1)" style="font-size:26px;color:#cbd5e1">›</button></div></div>${showPicker?`<div style="background:#f8fafc;border-radius:20px;padding:14px;margin-bottom:16px"><label class="label">보고 싶은 년·월 선택</label><input class="input" type="month" value="${calMonth}" onchange="calMonth=this.value;render()"></div>`:''}<div class="calendar">${['일','월','화','수','목','금','토'].map((d,i)=>`<div class="dow" style="color:${i===0?'#ef4444':i===6?'#2563eb':''}">${d}</div>`).join('')}${info.cells.map((d,i)=>{let hn=d?holidayName(y,m,d):'';return d?`<button class="day ${hn?'holiday':i%7===0?'sunday':i%7===6?'saturday':''} ${info.mark[d]?'marked':''} ${new Date().getFullYear()===y&&new Date().getMonth()===m&&new Date().getDate()===d?'today':''}" title="${hn}"><span class="day-num">${d}</span>${hn?`<span class="holiday-name">${shortHolidayName(hn)}</span>`:'<span class="holiday-spacer"></span>'}${info.mark[d]?'<span class="dot"></span>':'<span style="height:6px"></span>'}</button>`:`<div></div>`}).join('')}</div></section><div style="margin-top:16px;display:grid;gap:12px">${list.length?list.map(r=>{let photo=getPrimaryPhoto(r);return `<div class="card record"><button class="record-img" onclick="${photo?.dataUrl?`preview='${photo.dataUrl}';render()`:'void 0'}">${photo?.dataUrl?`<img src="${photo.dataUrl}">`:icon('image')}</button><button style="flex:1;text-align:left" onclick="openDetail('${r.id}')"><b>${fmt(r.recordedAt)}</b><p class="muted" style="margin:5px 0">${r.bodyParts.map(label).join(' · ')||'부위 없음'}</p><span class="pill orange">가려움 ${r.symptoms.itchScore}</span> <span class="pill rose">긁음 ${r.symptoms.scratchScore}</span></button></div>`}).join(''):`<div class="card p20" style="text-align:center">선택한 월의 기록이 없습니다<br><span class="muted small">${y}년 ${m+1}월에는 아직 저장된 기록이 없습니다.</span></div>`}</div></div>`}
function calInfo(y,m,records){let first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),cells=[];for(let i=0;i<first;i++)cells.push(null);for(let d=1;d<=last;d++)cells.push(d);while(cells.length%7)cells.push(null);let mark={};records.forEach(r=>{let d=new Date(r.recordedAt);if(d.getFullYear()===y&&d.getMonth()===m)mark[d.getDate()]=1});return{cells,mark}}
function moveMonth(n){let [y,m]=parseYM(calMonth);calMonth=monthVal(new Date(y,m+n,1));render()}
function delRec(id){
  if(!id) return;
  if(!confirm('이 기록을 삭제할까요? 삭제한 기록은 복구할 수 없습니다.')) return;
  state.records=state.records.filter(r=>r.id!==id);
  detailId=null;
  tab='records';
  save();
  toast='기록이 삭제되었습니다.';
  setTimeout(()=>{toast='';render()},1800);
  render();
}

><span class="v">${esc(sleepKo(r.sleepStatus))}</span></div></div></section><section class="card p20"><div class="detail-section-title"><b>메모</b></div><p class="detail-note">${esc(r.note||'-')}</p></section></div><div class="detail-action-stack"><button class="btn btn-white" style="width:100%" onclick="editRec('${r.id}')">기록 수정하기</button><button class="btn btn-danger" style="width:100%" onclick="delRec('${r.id}')">기록 삭제</button></div></div>`}
function report(){let p=prof(), rec=selectedRecords().filter(x=>within(x.recordedAt,reportRange)), s=reportSummary(rec), memoValue=document.getElementById('guardianMemo')?.value||'';return `<div class="screen">${header('Report','병원 리포트')}<div style="margin-bottom:16px">${chips(false)}</div><div class="report-profile">${avatar(p,24)}<span>${esc(p?.nickname||'-')} · 최근 ${reportRange}일 요약</span></div><section class="card p16" style="margin-bottom:16px"><div class="report-range">${[7,30].map(d=>`<button class="btn ${reportRange===d?'btn-soft':'btn-white'}" onclick="reportRange=${d};render()">최근 ${d}일</button>`).join('')}</div></section><div class="report-summary-grid">${[['기록 횟수',s.cnt+'회','최근 '+reportRange+'일'],['가려움 평균',s.itch,'/ 10'],['긁음 평균',s.scratch,'/ 10'],['가장 심했던 날',s.worst?fmtD(s.worst.recordedAt):'-',s.worstScore?('기록 점수 '+s.worstScore):'']].map(x=>`<div class="card report-stat"><span class="k">${x[0]}</span><span class="v">${x[1]}</span><span class="sub">${x[2]}</span></div>`).join('')}</div><section class="card p20" style="margin-top:16px"><div class="report-section-head"><b>많이 기록된 부위</b><span class="report-pill">TOP 부위</span></div><p class="report-parts">${s.parts.length?s.parts.map(x=>`${label(x.key)} ${x.count}회`).join(' · '):'기록 없음'}</p></section><section class="card p20" style="margin-top:16px"><div class="report-section-head"><b>사진 변화</b><span class="report-pill">${s.photoComparePart?`${label(s.photoComparePart)} 기준`:'첫 사진 → 최근 사진'}</span></div><p class="report-copy">${s.photoComparePart?`선택한 기간 안에서 ${label(s.photoComparePart)} 사진이 있는 첫 기록과 최근 기록을 비교합니다.`:'선택한 기간 안에서 사진이 있는 첫 기록과 가장 최근 기록을 비교합니다.'}</p><div class="report-photo-grid">${[[s.firstPhotoRecord,s.firstPhoto,'첫 기록'],[s.lastPhotoRecord,s.lastPhoto,'최근 기록']].map(item=>`<div class="report-photo-card"><button class="report-photo-btn" onclick="${item[1]?.dataUrl?`preview='${item[1].dataUrl}';render()`:'void 0'}">${item[1]?.dataUrl?`<img src="${item[1].dataUrl}">`:`<span class="photo-empty">${icon('image')}</span>`}</button><div class="report-photo-meta"><span class="label">${item[2]}</span><span class="date">${item[0]?fmtD(item[0].recordedAt):'-'}</span></div></div>`).join('')}</div><p class="soft-note" style="margin-top:10px">사진을 누르면 크게 볼 수 있어요.</p></section><section class="card p20 memo-card" style="margin-top:16px"><div class="report-section-head"><b>보호자 메모</b><span class="report-pill" style="background:#fff;color:#1d4ed8">전달용</span></div><div class="field" style="margin-top:8px"><textarea id="guardianMemo" class="textarea" placeholder="병원에 전달하고 싶은 내용을 입력하세요.">${esc(memoValue)}</textarea></div></section><div class="report-action-grid"><button class="btn btn-primary" onclick="downloadReportImage()" style="width:100%">리포트 저장 (PNG)</button><button class="btn btn-white" onclick="backup()" style="width:100%">JSON 저장</button></div></div>`}
function settings(){let p=prof();return `<div class="screen">${header('Settings','설정')}<section class="card p20"><div style="display:flex;gap:16px;align-items:center">${avatar(p,66)}<div><p class="small muted">현재 프로필</p><h2 style="margin:4px 0">${esc(p?.nickname||'-')}</h2><p class="muted">${p?.type==='child'?'아이':'부모'} · ${esc(p?.birthInfo||'나이대 미입력')}</p></div></div>${p?.skinMemo?`<div style="background:#f8fafc;border-radius:16px;padding:14px;margin-top:14px">${esc(p.skinMemo)}</div>`:''}<div style="margin-top:16px">${chips(false)}</div><div class="grid2" style="margin-top:16px"><button class="btn btn-white" onclick="editProfileId='${p.id}';render()">프로필 수정</button><button class="btn btn-soft" onclick="addProfile=true;render()">+ 가족 추가</button></div></section><section class="card settings-list" style="margin-top:16px"><div class="settings-row"><span class="settings-ico">${icon('file')}</span><div><b>기록 항목 설정</b><p>부위, 증상, 음식, 수면 항목 관리</p></div><span class="chev">›</span></div><div class="settings-row"><span class="settings-ico">${icon('settings')}</span><div><b>의료 면책 문구</b><p>진단·치료·처방 기능 없음</p></div><span class="chev">›</span></div><div class="settings-row"><span class="settings-ico">${icon('db')}</span><div><b>테스트 버전</b><p>${VERSION}</p></div><span class="chev">›</span></div></section><section class="card p20" style="margin-top:16px"><b>데이터 백업</b><p class="muted small">기기 변경이나 브라우저 데이터 삭제 전에 백업해 주세요.</p><div class="grid2"><button class="btn btn-primary" onclick="backup()">백업 저장</button><label class="btn btn-white">백업 불러오기<input type="file" accept="application/json" hidden onchange="restore(this.files[0])"></label></div></section><section class="card p20" style="margin-top:16px;background:#eff6ff;color:#1e3a8a"><b>개인정보 안내</b><p>입력한 기록은 현재 브라우저 저장소에 저장되며 개발자 서버로 자동 전송하지 않습니다.</p></section><button class="btn btn-danger" style="width:100%;margin-top:16px" onclick="resetAll()">모든 데이터 삭제</button></div>`}

function selectProfileType(nextType){
  const hidden=document.getElementById('typeHidden');
  if(hidden) hidden.value=nextType;
  const selfBtn=document.getElementById('typeSelf');
  const childBtn=document.getElementById('typeChild');
  if(selfBtn) selfBtn.className=nextType==='self'?'btn btn-soft':'btn btn-white';
  if(childBtn) childBtn.className=nextType==='child'?'btn btn-soft':'btn btn-white';
  const avatarPrev=document.getElementById('avatarPrev');
  const avatarData=document.getElementById('avatarData');
  if(avatarPrev && avatarData && !avatarData.value){ avatarPrev.textContent=nextType==='child'?'😘':'😊'; }
}
function renderProfile(){let init=editProfileId?state.profiles.find(p=>p.id===editProfileId):null;let type=init?.type||'child',avatarData=init?.avatarDataUrl||'';document.getElementById('root').innerHTML=`<div class="screen"><div class="title-row"><div><p class="eyebrow">Profile</p><h1 class="h1">${editProfileId?'프로필 수정':addProfile?'가족 / 프로필 추가':'프로필 생성'}</h1></div>${(addProfile||editProfileId)?`<button class="icon-btn" onclick="addProfile=false;editProfileId=null;render()">${icon('back')}</button>`:''}</div><div class="grid2" style="margin-bottom:16px"><button id="typeSelf" class="${type==='self'?'btn btn-soft':'btn btn-white'}" type="button" onclick="selectProfileType('self')">😊 부모</button><button id="typeChild" class="${type==='child'?'btn btn-soft':'btn btn-white'}" type="button" onclick="selectProfileType('child')">😘 아이</button></div><input id="typeHidden" type="hidden" value="${type}"><section class="card p16" style="margin-bottom:16px"><label class="label">프로필 사진</label><div style="display:flex;gap:14px;align-items:center"><span id="avatarPrev" class="avatar" style="width:64px;height:64px">${avatarData?`<img src="${avatarData}">`:emoji({type})}</span><label class="btn btn-white">사진 업로드<input type="file" accept="image/*" hidden onchange="let rd=new FileReader();rd.onload=()=>{document.getElementById('avatarData').value=rd.result;document.getElementById('avatarPrev').innerHTML='<img src=&quot;'+rd.result+'&quot;>'};rd.readAsDataURL(this.files[0])"></label><input id="avatarData" type="hidden" value="${esc(avatarData)}"></div></section><div class="field"><label class="label">이름/별명</label><input id="nick" class="input" value="${esc(init?.nickname||'')}" placeholder="예) 지우"></div><div class="field"><label class="label">생년월일 또는 나이대</label><input id="birth" class="input" value="${esc(init?.birthInfo||'')}" placeholder="예) 2018.05 또는 7세"></div><div class="field"><label class="label">피부질환 메모</label><textarea id="memo" class="textarea" placeholder="예) 결절성 양진 치료 경험, 아토피 병력 등">${esc(init?.skinMemo||'')}</textarea></div><button class="btn btn-primary" style="width:100%;height:56px" onclick="saveProfile('${init?.id||''}')">${editProfileId?'수정 저장':addProfile?'추가':'프로필 저장'}</button></div>`}
function saveProfile(id){let nick=document.getElementById('nick').value.trim();if(!nick)return alert('이름 또는 별명을 입력해 주세요.');let p={id:id||uid('profile'),type:document.getElementById('typeHidden').value,nickname:nick,birthInfo:document.getElementById('birth').value.trim(),skinMemo:document.getElementById('memo').value.trim(),avatarDataUrl:document.getElementById('avatarData').value,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};let i=state.profiles.findIndex(x=>x.id===p.id); if(i>=0)state.profiles[i]={...state.profiles[i],...p}; else state.profiles.push(p);state.selectedProfileId=p.id;state.onboardingCompleted=true;addProfile=false;editProfileId=null;render()}
function backup(){dl(`soothenote-backup-${Date.now()}.json`,JSON.stringify(norm(state),null,2),'application/json')}function restore(file){if(!file)return;let rd=new FileReader();rd.onload=()=>{try{state=norm(JSON.parse(rd.result));render();alert('백업 데이터를 불러왔습니다.')}catch(e){alert('백업 파일을 읽을 수 없습니다.')}};rd.readAsText(file)}function resetAll(){if(confirm('모든 데이터를 삭제할까요?')){state={onboardingCompleted:false,profiles:[],selectedProfileId:null,records:[]};localStorage.removeItem(KEY);deleteDbState();render()}}
function loadImage(src){return new Promise((resolve,reject)=>{let img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src;});}
async function drawReportPhoto(ctx,img,x,y,w,h){ctx.fillStyle='#f8fafc';ctx.fillRect(x,y,w,h);if(img?.dataUrl){try{let image=await loadImage(img.dataUrl);let scale=Math.max(w/image.width,h/image.height),dw=image.width*scale,dh=image.height*scale,dx=x+(w-dw)/2,dy=y+(h-dh)/2;ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(image,dx,dy,dw,dh);ctx.restore();}catch(e){ctx.fillStyle='#e2e8f0';ctx.fillRect(x,y,w,h);}}else{ctx.fillStyle='#ffffff';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#e2e8f0';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,w-2,h-2);ctx.strokeStyle='#93c5fd';ctx.lineWidth=2;ctx.beginPath();ctx.rect(x+w/2-18,y+h/2-14,36,28);ctx.stroke();ctx.beginPath();ctx.moveTo(x+w/2-6,y+h/2-4);ctx.lineTo(x+w/2+2,y+h/2+6);ctx.lineTo(x+w/2+14,y+h/2-8);ctx.stroke();ctx.beginPath();ctx.arc(x+w/2-7,y+h/2-7,3,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#94a3b8';ctx.font=`600 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif`;ctx.fillText('사진 없음',x+26,y+h-22);}}
async function downloadReportImage(){let p=prof(),rec=selectedRecords().filter(x=>within(x.recordedAt,reportRange)),s=reportSummary(rec),memo=document.getElementById('guardianMemo')?.value||'';let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=1080;canvas.height=1920;ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,1080,1920);function rr(x,y,w,h,r,fill){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}function tx(t,x,y,size,color='#0f172a',weight='600'){ctx.fillStyle=color;ctx.font=`${weight} ${size}px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif`;ctx.fillText(String(t),x,y)}function wrap(t,x,y,maxW,lh,size,color='#475569',weight='500',maxLines=3){ctx.fillStyle=color;ctx.font=`${weight} ${size}px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif`;let words=String(t||'-').split(/\s+/),line='',lines=[];for(let word of words){let test=line?line+' '+word:word;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=word;}else line=test;}if(line)lines.push(line);if(lines.length>maxLines){lines=lines.slice(0,maxLines);let last=lines[maxLines-1];while(ctx.measureText(last+'…').width>maxW&&last.length>1)last=last.slice(0,-1);lines[maxLines-1]=last+'…';}lines.forEach((ln,i)=>ctx.fillText(ln,x,y+i*lh));}
  tx(APP_NAME,70,100,34,'#60a5fa','700');tx('병원 리포트',70,165,58,'#0f172a','800');tx(`프로필: ${p?.nickname||'-'} · 최근 ${reportRange}일`,70,220,30,'#64748b','600');[[`기록 횟수`,`${s.cnt}회`,`최근 ${reportRange}일`],[`가려움 평균`,`${s.itch}`,'/ 10'],[`긁음 평균`,`${s.scratch}`,'/ 10'],[`가장 심했던 날`,s.worst?fmtD(s.worst.recordedAt):'-',s.worstScore?`기록 점수 ${s.worstScore}`:'']].forEach((c,i)=>{let x=70+(i%2)*485,y=290+Math.floor(i/2)*220;rr(x,y,440,170,32,'#fff');tx(c[0],x+34,y+48,26,'#64748b','600');tx(c[1],x+34,y+105,46,'#0f172a','800');tx(c[2],x+34,y+145,24,'#94a3b8','500')});rr(70,760,940,145,34,'#fff');tx('많이 기록된 부위',110,820,32,'#0f172a','700');wrap(s.parts.length?s.parts.map(x=>`${label(x.key)} ${x.count}회`).join(' · '):'기록 없음',110,872,780,36,28,'#475569','600',2);
  rr(70,930,940,450,34,'#fff');tx('사진 변화',110,990,32,'#0f172a','700');tx(s.photoComparePart?`${label(s.photoComparePart)} 기준`:'첫 사진 → 최근 사진',800,990,24,'#3b82f6','700');await drawReportPhoto(ctx,s.firstPhoto,110,1035,400,250);await drawReportPhoto(ctx,s.lastPhoto,570,1035,400,250);ctx.save();ctx.textAlign='center';tx('첫 기록',310,1318,24,'#64748b','700');tx(s.firstPhotoRecord?fmtD(s.firstPhotoRecord.recordedAt):'-',310,1350,22,'#94a3b8','500');tx('최근 기록',770,1318,24,'#64748b','700');tx(s.lastPhotoRecord?fmtD(s.lastPhotoRecord.recordedAt):'-',770,1350,22,'#94a3b8','500');ctx.restore();
  rr(70,1410,940,250,34,'#eff6ff');tx('보호자 메모',110,1475,32,'#1d4ed8','700');wrap(memo.trim()||'-',110,1535,820,38,28,'#475569','500',4);tx('이 자료는 사용자가 입력한 기록을 요약한 참고용 자료이며, 의학적 진단이나 치료 판단을 제공하지 않습니다.',70,1775,22,'#94a3b8','500');tx(new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric'}).format(new Date()),70,1825,22,'#94a3b8','500');dl(`soothenote-report-${reportRange}days.png`,dataURLtoBlob(canvas.toDataURL('image/png')),'image/png')}
function dataURLtoBlob(dataUrl){let arr=dataUrl.split(','),mime=arr[0].match(/:(.*?);/)[1],bstr=atob(arr[1]),n=bstr.length,u8=new Uint8Array(n);while(n--)u8[n]=bstr.charCodeAt(n);return new Blob([u8],{type:mime})}
function dl(name,content,type){let b=content instanceof Blob?content:new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}
load().then(()=>{render();setTimeout(()=>{splash=false;render()},3000)}).catch(()=>{render();setTimeout(()=>{splash=false;render()},3000)});
