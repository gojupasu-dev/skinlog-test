<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>SootheNote</title>
  <style>
    :root{--bg:#f8fafc;--card:#fff;--line:#eef2f7;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blue2:#eff6ff;--rose:#fff1f2;--roseText:#e11d48;--orange:#fff7ed;--orangeText:#ea580c;--shadow:0 1px 8px rgba(15,23,42,.05)}
    *{box-sizing:border-box}body{margin:0;background:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{border:0;background:none;cursor:pointer}.app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}.screen{min-height:100vh;padding:32px 24px 104px}.title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.eyebrow{font-size:14px;font-weight:650;color:var(--blue);margin:0}.h1{font-size:30px;font-weight:750;letter-spacing:-.04em;margin:4px 0 0}.icon-btn{width:44px;height:44px;border-radius:16px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:#64748b}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.p16{padding:16px}.p20{padding:20px}.muted{color:var(--muted)}.small{font-size:12px}.btn{height:48px;border-radius:16px;padding:0 16px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px}.btn-primary{background:#2563eb;color:#fff}.btn-soft{background:var(--blue2);color:#1d4ed8;border:1px solid #dbeafe}.btn-white{background:#fff;color:#334155;border:1px solid var(--line);box-shadow:var(--shadow)}.btn-danger{background:#fff;color:#dc2626;border:1px solid #fecaca}.chips{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border-radius:24px;border:1px solid var(--line);background:#fff;color:#64748b;padding:8px 14px;font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}.chip.active{background:var(--blue2);border-color:#bfdbfe;color:#1d4ed8}.avatar{width:34px;height:34px;border-radius:50%;background:#f1f5f9;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;font-size:18px;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.tabs{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;height:78px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 10px;box-shadow:0 -8px 24px rgba(15,23,42,.05)}.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:650;color:#94a3b8}.tab svg{width:28px;height:28px;padding:5px;border-radius:14px}.tab.active{color:#2563eb}.tab.active svg{background:var(--blue2)}.splash{display:flex;min-height:100vh;align-items:center;justify-content:center;background:var(--bg);padding:24px;text-align:center}.brand svg{filter:drop-shadow(0 8px 8px rgba(147,197,253,.25))}.brand-name{font-size:48px;font-weight:750;letter-spacing:-.045em;color:#60a5fa;margin:20px 0 0}.brand-tag{font-size:19px;font-weight:650;color:#64748b;margin:14px 0 0}.brand-sub{font-size:15px;font-weight:500;color:#94a3b8;margin:10px 0 0}.field{margin-bottom:16px}.label{display:block;font-size:14px;font-weight:650;color:#334155;margin:0 0 8px}.input,.textarea,.select{width:100%;border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;outline:none;box-shadow:var(--shadow)}.textarea{min-height:96px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.part-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.part{border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 4px;font-weight:650;color:#475569}.part.active{background:var(--blue2);border-color:#bfdbfe;color:#1d4ed8}.photo-box{height:140px;border:1px dashed #bfdbfe;background:rgba(239,246,255,.7);border-radius:24px;color:#2563eb;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:650}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.photo-thumb{height:86px;border-radius:16px;overflow:hidden;background:#f1f5f9;position:relative}.photo-thumb img{width:100%;height:100%;object-fit:cover}.score{padding:16px}.score input{width:100%;accent-color:#2563eb}.fixed-save{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:rgba(255,255,255,.95);border-top:1px solid var(--line);padding:12px 24px;z-index:9}.pill{display:inline-flex;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:650}.pill.orange{background:var(--orange);color:var(--orangeText)}.pill.rose{background:var(--rose);color:var(--roseText)}.month-card{padding:20px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 0;text-align:center}.dow{font-size:12px;font-weight:650;color:#64748b}.day{height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center}.day-num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500}.today .day-num{background:#0f172a;color:#fff}.selected:not(.today) .day-num{box-shadow:0 0 0 1px #bfdbfe}.dot{width:6px;height:6px;border-radius:50%;background:#3b82f6;margin-top:3px}.record{display:flex;gap:14px;padding:12px;border-radius:24px}.record-img{width:76px;height:76px;border-radius:18px;overflow:hidden;background:#f1f5f9;flex:none}.record-img img{width:100%;height:100%;object-fit:cover}.toast{position:fixed;bottom:94px;left:50%;transform:translateX(-50%);max-width:398px;width:calc(100% - 32px);background:#0f172a;color:#fff;padding:12px 16px;border-radius:16px;text-align:center;font-weight:650;z-index:30}.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.modal img{max-width:100%;max-height:80vh;border-radius:20px}.hide{display:none!important}
  </style>
</head>
<body><div id="root" class="app"></div>
<script>
const APP_NAME='SootheNote', APP_TAG='우리 가족 피부 기록장', APP_SUB='피부 변화를 차분히 기록해요';
const KEY='skinlog_mvp_v1', VERSION='v10-mobile-preview-3s';
const BODY=[['face','얼굴'],['ear','귀'],['neck','목'],['trunk','몸통'],['buttocks','엉덩이'],['arm','팔'],['wrist','손목'],['hand','손'],['leg','다리'],['ankle','발목'],['foot','발'],['other','기타']];
const LEG={chest:'가슴',belly:'배',back:'등'};
let state={onboardingCompleted:false,profiles:[],selectedProfileId:null,records:[]};
let tab='home', draft=null, detailId=null, formMode='detail', splash=true, toast='', preview=null, addProfile=false, editProfileId=null, filter='all', calMonth=monthVal(new Date()), showPicker=false, reportRange=7;
function uid(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function load(){try{const raw=localStorage.getItem(KEY); if(raw) state=norm(JSON.parse(raw));}catch(e){} }
function save(){localStorage.setItem(KEY,JSON.stringify(norm(state)))}
function norm(x){x=x||{};let profiles=Array.isArray(x.profiles)?x.profiles:(x.profile?[x.profile]:[]);let sel=x.selectedProfileId||profiles[0]?.id||null;let records=(x.records||[]).map(r=>({...r,profileId:r.profileId||sel,food:r.food||{breakfast:'',lunch:'',dinner:'',snack:r.foodMemo||''},foodMemo:r.foodMemo||r.food?.snack||'',symptoms:{itchScore:0,rednessScore:0,oozeScore:0,scaleScore:0,scratchScore:0,...r.symptoms}}));return{onboardingCompleted:!!x.onboardingCompleted,profiles,selectedProfileId:sel,records}}
function prof(){return state.profiles.find(p=>p.id===state.selectedProfileId)||state.profiles[0]||null}
function emoji(p){return p?.type==='child'?'😘':'😊'}
function avatar(p,size=34){return `<span class="avatar" style="width:${size}px;height:${size}px">${p?.avatarDataUrl?`<img src="${p.avatarDataUrl}">`:emoji(p)}</span>`}
function nowVal(){let d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16)}
function monthVal(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function parseYM(v){let m=String(v).match(/^([0-9]{4})-([0-9]{2})$/);return m?[+m[1],+m[2]-1]:[new Date().getFullYear(),new Date().getMonth()]}
function fmt(v){let d=new Date(v);return isNaN(d)?'-':new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'}).format(d)}
function fmtD(v){let d=new Date(v);return isNaN(d)?'-':new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(d)}
function ago(v){if(!v)return'기록 없음';let d=new Date(v),t=new Date();let a=new Date(t.getFullYear(),t.getMonth(),t.getDate()),b=new Date(d.getFullYear(),d.getMonth(),d.getDate());let n=Math.round((a-b)/86400000);return n===0?'오늘':n===1?'1일 전':n+'일 전'}
function label(k){return BODY.find(x=>x[0]===k)?.[1]||LEG[k]||k}
function avg(a){let v=a.filter(n=>typeof n==='number'&&!isNaN(n));return v.length?+(v.reduce((s,n)=>s+n,0)/v.length).toFixed(1):0}
function within(v,days){let d=new Date(v),n=new Date(),s=new Date(n);s.setDate(n.getDate()-days+1);s.setHours(0,0,0,0);return d>=s&&d<=n}
function icon(t){const p={edit:'M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3Z M14 6l4 4',calendar:'M8 3v4M16 3v4M4 10h16 M4 5h16v15H4z',chart:'M5 20V9M12 20V4M19 20v-7',settings:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z M4 12h2M18 12h2M12 4v2M12 18v2',plus:'M12 5v14M5 12h14',save:'M5 12l4 4L19 6',image:'M4 5h16v14H4z M8 15l3-3 3 3 2-2 3 3',chev:'M9 18l6-6-6-6',back:'M15 18l-6-6 6-6',trash:'M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3',file:'M7 3h7l4 4v14H7z M14 3v5h5M9 13h6M9 17h6',db:'M5 6c0 2 14 2 14 0s-14-2-14 0v12c0 2 14 2 14 0V6 M5 12c0 2 14 2 14 0'}[t]||'';return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg>`}
function brand(size=170){return `<svg width="${size}" height="${size}" viewBox="0 0 120 120"><defs><linearGradient id="g" x1="34" y1="18" x2="88" y2="104"><stop offset="0" stop-color="#DBEAFE"/><stop offset=".56" stop-color="#93C5FD"/><stop offset="1" stop-color="#60A5FA"/></linearGradient></defs><path d="M61 8C47 23 31 42 31 64C31 88 49 104 68 104C88 104 104 88 104 67C104 44 86 32 72 20C67 16 64 12 61 8Z" fill="url(#g)"/><circle cx="50" cy="62" r="20" fill="white" opacity=".96"/><circle cx="75" cy="62" r="20" fill="white" opacity=".96"/><circle cx="63" cy="78" r="13" fill="white"/><path d="M43 60c2.6 3.2 7.1 3.2 9.7 0M68 60c2.6 3.2 7.1 3.2 9.7 0" stroke="#8DBAEC" stroke-width="3" stroke-linecap="round"/><path d="M58 78c2.3 2.2 5.9 2.2 8.2 0" stroke="#8DBAEC" stroke-width="2.6" stroke-linecap="round" fill="none"/><path d="M40 80C50 92 76 95 95 73" stroke="white" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M89 31l3.6 7.2 7.4 3.6-7.4 3.6L89 53l-3.6-7.6-7.4-3.6 7.4-3.6L89 31Z" fill="#60A5FA" opacity=".8"/></svg>`}
function render(){let r=document.getElementById('root'); if(splash){r.innerHTML=`<div class="splash"><div><div class="brand">${brand(170)}</div><div class="brand-name">${APP_NAME}</div><div class="brand-tag">${APP_TAG}</div><div class="brand-sub">${APP_SUB}</div></div></div>`;return}
 if(!state.profiles.length||addProfile||editProfileId){renderProfile();return}
 r.innerHTML=`${view()}${nav()}${toast?`<div class="toast">${toast}</div>`:''}${preview?`<div class="modal" onclick="preview=null;render()"><div><img src="${preview}"><p style="text-align:center;color:white;font-size:12px">두 손가락으로 확대해서 확인할 수 있어요.</p></div></div>`:''}`; save()}
function nav(){return `<div class="tabs">${[['home','오늘 기록','edit'],['records','기록 보기','calendar'],['report','리포트','chart'],['settings','설정','settings']].map(x=>`<button class="tab ${tab===x[0]?'active':''}" onclick="tab='${x[0]}';detailId=null;draft=null;render()">${icon(x[2])}<span>${x[1]}</span></button>`).join('')}</div>`}
function header(e,t,act=''){return `<div class="title-row"><div><p class="eyebrow">${e}</p><h1 class="h1">${t}</h1></div>${act}</div>`}
function chips(add=false){let s=`<div class="chips">${state.profiles.map(p=>`<button class="chip ${p.id===state.selectedProfileId?'active':''}" onclick="state.selectedProfileId='${p.id}';render()">${avatar(p)}<span>${esc(p.nickname)}</span></button>`).join('')}`; if(add)s+=`<button class="chip" onclick="addProfile=true;render()">+ 가족 추가</button>`; return s+'</div>'}
function view(){if(draft)return form(); if(detailId)return detail(); if(tab==='home')return home(); if(tab==='records')return records(); if(tab==='report')return report(); return settings()}
function selectedRecords(){let p=prof(); return state.records.filter(x=>!p||x.profileId===p.id).sort((a,b)=>new Date(b.recordedAt)-new Date(a.recordedAt))}
function home(){let p=prof(), rec=selectedRecords(), latest=rec[0], last7=rec.filter(x=>within(x.recordedAt,7));return `<div class="screen">${header('Today','오늘 기록',`<button class="icon-btn" onclick="addProfile=true;render()">${icon('plus')}</button>`)}${chips(true)}<section class="card p20" style="margin-top:20px"><div style="display:flex;gap:16px;align-items:center">${avatar(p,70)}<div><p class="muted" style="font-weight:500;margin:0">오늘 ${esc(p?.nickname||'가족')} 피부 상태를 기록해볼까요?</p><h2 style="font-size:24px;margin:8px 0 0;font-weight:700">${latest&&(latest.symptoms.itchScore>=7||latest.symptoms.scratchScore>=7)?'조금 더 살펴봐요':latest?'차분히 기록해볼까요?':'첫 기록을 남겨볼까요?'}</h2><p class="muted" style="margin:8px 0 0;font-weight:500">마지막 기록: ${ago(latest?.recordedAt)}</p></div></div></section><div class="grid2" style="margin-top:16px"><button class="card p20" style="text-align:left;background:#eff6ff;color:#1d4ed8" onclick="newRec('quick')"><div class="icon-btn" style="color:#2563eb;margin-bottom:18px">${icon('edit')}</div><b>빠르게 남기기</b><p class="small" style="margin:6px 0 0">사진·부위·가려움·긁음</p></button><button class="card p20" style="text-align:left" onclick="newRec('detail')"><div class="icon-btn" style="color:#2563eb;margin-bottom:18px">${icon('file')}</div><b>자세히 남기기</b><p class="small muted" style="margin:6px 0 0">약·음식·수면·메모까지</p></button></div><section class="card p20" style="margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:18px">최근 상태</h2><span class="pill" style="background:#eff6ff;color:#2563eb">최근 7일</span></div><div class="grid3" style="margin-top:14px"><div class="pill orange" style="display:block;text-align:center">가려움<br><b>${avg(last7.map(x=>x.symptoms.itchScore))}</b></div><div class="pill rose" style="display:block;text-align:center">긁음<br><b>${avg(last7.map(x=>x.symptoms.scratchScore))}</b></div><div class="pill" style="display:block;text-align:center;background:#eff6ff;color:#2563eb">기록<br><b>${last7.length}회</b></div></div><div style="margin-top:14px;background:#f8fafc;border-radius:16px;padding:14px"><p class="small muted" style="margin:0">최근 사용한 약 / 보습제</p><b>${esc(latest?.medicines||'아직 기록 없음')}</b></div></section></div>`}
function emptyRecord(){return{id:uid('record'),profileId:prof()?.id,recordedAt:nowVal(),bodyParts:[],photos:[],symptoms:{itchScore:0,rednessScore:0,oozeScore:0,scaleScore:0,scratchScore:0},medicines:'',food:{breakfast:'',lunch:'',dinner:'',snack:''},foodMemo:'',sleepStatus:'',note:'',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}}
function newRec(mode){formMode=mode;draft=emptyRecord();tab='home';render()}
function form(){let quick=formMode==='quick', edit=!!state.records.find(x=>x.id===draft.id);return `<div class="screen" style="padding-bottom:170px"><div style="display:flex;gap:12px;align-items:center;margin-bottom:22px"><button class="icon-btn" onclick="draft=null;render()">${icon('back')}</button><div><p class="eyebrow">${edit?'Edit':quick?'Quick':'Detail'}</p><h1 class="h1">${edit?'기록 수정':quick?'빠른 기록':'상세 기록'}</h1></div></div><div class="card p16" style="margin-bottom:16px">현재 기록 대상: ${avatar(prof(),24)} ${esc(prof()?.nickname||'')}</div><button class="btn btn-soft" onclick="loadPrev()" style="margin-bottom:16px;width:100%">이전 기록 불러오기</button><div class="field"><label class="label">기록 시간 (자동 입력)</label><input class="input" type="datetime-local" value="${draft.recordedAt}" onchange="draft.recordedAt=this.value"></div><label class="photo-box">${icon('image')}<span>+ 사진 추가</span><input type="file" accept="image/*" multiple hidden onchange="addPhotos(this.files)"></label><div class="photos">${draft.photos.map((p,i)=>`<div class="photo-thumb"><img src="${p.dataUrl}"><button style="position:absolute;right:4px;top:4px;background:white;border-radius:50%;width:22px;height:22px" onclick="draft.photos.splice(${i},1);render()">×</button></div>`).join('')}</div><h3>부위 선택</h3><div class="part-grid">${BODY.map(x=>`<button class="part ${draft.bodyParts.includes(x[0])?'active':''}" onclick="togglePart('${x[0]}')">${x[1]}</button>`).join('')}</div><h3>증상 점수</h3>${score('가려움','itchScore')}${quick?score('긁음','scratchScore'):`${score('붉음','rednessScore')}${score('진물','oozeScore')}${score('각질','scaleScore')}${score('긁음','scratchScore')}`}${quick?`<details class="card p16" style="margin-top:16px"><summary style="font-weight:650">약·음식·수면·메모 추가</summary>${extra()}</details>`:extra()}<div class="fixed-save"><button class="btn btn-primary" style="width:100%" onclick="saveRec()">${icon('save')} ${edit?'수정 저장':quick?'빠른 기록 저장':'상세 기록 저장'}</button></div></div>`}
function score(label,key){return `<div class="card score" style="margin:10px 0"><div style="display:flex;justify-content:space-between"><b>${label}</b><span class="pill">${draft.symptoms[key]} / 10</span></div><input type="range" min="0" max="10" value="${draft.symptoms[key]}" oninput="draft.symptoms.${key}=+this.value;this.previousElementSibling.querySelector('.pill').textContent=this.value+' / 10'"></div>`}
function extra(){return `<div class="field"><label class="label">오늘 사용한 약 / 보습제</label><input class="input" value="${esc(draft.medicines)}" onchange="draft.medicines=this.value"></div>${['breakfast','lunch','dinner','snack'].map((k,i)=>`<div class="field"><label class="label">${['아침','점심','저녁','간식 / 특이 음식'][i]}</label><input class="input" value="${esc(draft.food[k]||'')}" onchange="draft.food.${k}=this.value;${k==='snack'?'draft.foodMemo=this.value':''}"></div>`).join('')}<div class="field"><label class="label">수면 상태</label><select class="select" onchange="draft.sleepStatus=this.value"><option value="">선택 안 함</option><option value="good">좋음</option><option value="normal">보통</option><option value="bad">나쁨</option></select></div><div class="field"><label class="label">메모</label><textarea class="textarea" onchange="draft.note=this.value">${esc(draft.note)}</textarea></div>`}
function togglePart(k){draft.bodyParts=draft.bodyParts.includes(k)?draft.bodyParts.filter(x=>x!==k):[...draft.bodyParts,k];render()}
function addPhotos(files){Promise.all([...files].slice(0,10-draft.photos.length).map(f=>new Promise(res=>{let rd=new FileReader();rd.onload=()=>res({id:uid('photo'),dataUrl:rd.result,name:f.name});rd.readAsDataURL(f)}))).then(imgs=>{draft.photos=[...draft.photos,...imgs].slice(0,10);render()})}
function loadPrev(){let last=selectedRecords()[0];if(!last)return alert('불러올 이전 기록이 없습니다.');draft={...draft,bodyParts:[...last.bodyParts],symptoms:{...draft.symptoms,...last.symptoms},medicines:last.medicines||'',food:{breakfast:last.food?.breakfast||'',lunch:last.food?.lunch||'',dinner:last.food?.dinner||'',snack:last.food?.snack||last.foodMemo||''},foodMemo:last.foodMemo||'',sleepStatus:last.sleepStatus||'',note:last.note||''};alert('이전 기록을 불러왔습니다. 사진과 기록 시간은 새 기록 기준으로 유지됩니다.');render()}
function saveRec(){if(!draft.bodyParts.length)return alert('부위를 하나 이상 선택해 주세요.');let i=state.records.findIndex(x=>x.id===draft.id);draft.updatedAt=new Date().toISOString(); if(i>=0)state.records[i]=draft; else state.records.unshift(draft); toast=i>=0?'기록이 수정되었습니다.':'기록이 저장되었습니다.'; draft=null; tab='records'; setTimeout(()=>{toast='';render()},1800); render()}
function records(){let [y,m]=parseYM(calMonth), all=selectedRecords(), info=calInfo(y,m,all), month=all.filter(r=>{let d=new Date(r.recordedAt);return d.getFullYear()===y&&d.getMonth()===m}), list=month.filter(r=>filter==='severe'?r.symptoms.itchScore>=7||r.symptoms.scratchScore>=7||r.symptoms.rednessScore>=7:filter==='medicine'?!!r.medicines?.trim():true);return `<div class="screen">${header('Records','기록 보기',`<button class="icon-btn" onclick="showPicker=!showPicker;render()">${icon('calendar')}</button>`)}${chips(false)}<div class="chips" style="margin-top:16px">${[['all','전체'],['severe','심한 날'],['medicine','약 사용']].map(x=>`<button class="chip ${filter===x[0]?'active':''}" onclick="filter='${x[0]}';render()">${x[1]}</button>`).join('')}</div><section class="card month-card" style="margin-top:16px"><div style="display:flex;justify-content:space-between"><div><button style="font-size:20px;font-weight:700" onclick="showPicker=!showPicker;render()">${y}년 ${m+1}월 ⌄</button><p class="muted" style="font-weight:500"><span style="display:inline-block;width:8px;height:8px;background:#3b82f6;border-radius:50%"></span> 기록 ${month.length}건</p></div><div><button onclick="moveMonth(-1)" style="font-size:26px;color:#cbd5e1">‹</button><button onclick="moveMonth(1)" style="font-size:26px;color:#cbd5e1">›</button></div></div>${showPicker?`<div style="background:#f8fafc;border-radius:20px;padding:14px;margin-bottom:16px"><label class="label">보고 싶은 년·월 선택</label><input class="input" type="month" value="${calMonth}" onchange="calMonth=this.value;render()"></div>`:''}<div class="calendar">${['일','월','화','수','목','금','토'].map((d,i)=>`<div class="dow" style="color:${i===0?'#ef4444':i===6?'#2563eb':''}">${d}</div>`).join('')}${info.cells.map((d,i)=>d?`<button class="day ${info.mark[d]?'marked':''} ${new Date().getFullYear()===y&&new Date().getMonth()===m&&new Date().getDate()===d?'today':''}"><span class="day-num">${d}</span>${info.mark[d]?'<span class="dot"></span>':'<span style="height:6px"></span>'}</button>`:`<div></div>`).join('')}</div></section><div style="margin-top:16px;display:grid;gap:12px">${list.length?list.map(r=>`<div class="card record"><button class="record-img" onclick="${r.photos?.[0]?.dataUrl?`preview='${r.photos[0].dataUrl}';render()`:'void 0'}">${r.photos?.[0]?.dataUrl?`<img src="${r.photos[0].dataUrl}">`:icon('image')}</button><button style="flex:1;text-align:left" onclick="detailId='${r.id}';render()"><b>${fmt(r.recordedAt)}</b><p class="muted" style="margin:5px 0">${r.bodyParts.map(label).join(' · ')||'부위 없음'}</p><span class="pill orange">가려움 ${r.symptoms.itchScore}</span> <span class="pill rose">긁음 ${r.symptoms.scratchScore}</span></button></div>`).join(''):`<div class="card p20" style="text-align:center">선택한 월의 기록이 없습니다<br><span class="muted small">${y}년 ${m+1}월에는 아직 저장된 기록이 없습니다.</span></div>`}</div></div>`}
function calInfo(y,m,records){let first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),cells=[];for(let i=0;i<first;i++)cells.push(null);for(let d=1;d<=last;d++)cells.push(d);while(cells.length%7)cells.push(null);let mark={};records.forEach(r=>{let d=new Date(r.recordedAt);if(d.getFullYear()===y&&d.getMonth()===m)mark[d.getDate()]=1});return{cells,mark}}
function moveMonth(n){let [y,m]=parseYM(calMonth);calMonth=monthVal(new Date(y,m+n,1));render()}
function detail(){let r=state.records.find(x=>x.id===detailId); if(!r)return records();return `<div class="screen">${header('Detail','기록 상세',`<button class="icon-btn" onclick="editRec('${r.id}')">${icon('edit')}</button>`)}${r.photos?.[0]?`<button class="card" style="overflow:hidden;width:100%;height:280px" onclick="preview='${r.photos[0].dataUrl}';render()"><img src="${r.photos[0].dataUrl}" style="width:100%;height:100%;object-fit:cover"></button>`:''}<section class="card p20" style="margin-top:16px"><b>${fmt(r.recordedAt)}</b><p class="muted">대상: ${avatar(state.profiles.find(p=>p.id===r.profileId),24)} ${esc(state.profiles.find(p=>p.id===r.profileId)?.nickname||'-')}</p><p class="muted">부위: ${r.bodyParts.map(label).join(', ')}</p></section><div class="grid3" style="margin-top:12px">${[['가려움','itchScore'],['붉음','rednessScore'],['긁음','scratchScore']].map(x=>`<div class="card p16" style="text-align:center"><span class="small muted">${x[0]}</span><br><b>${r.symptoms[x[1]]}</b></div>`).join('')}</div><section class="card p20" style="margin-top:12px"><b>사용한 약 / 보습제</b><p>${esc(r.medicines||'-')}</p><b>음식 기록</b><p>아침: ${esc(r.food?.breakfast||'-')}<br>점심: ${esc(r.food?.lunch||'-')}<br>저녁: ${esc(r.food?.dinner||'-')}<br>간식: ${esc(r.food?.snack||r.foodMemo||'-')}</p><b>메모</b><p>${esc(r.note||'-')}</p></section><button class="btn btn-white" style="width:100%;margin-top:12px" onclick="editRec('${r.id}')">기록 수정하기</button><button class="btn btn-danger" style="width:100%;margin-top:12px" onclick="delRec('${r.id}')">기록 삭제</button></div>`}
function editRec(id){draft=JSON.parse(JSON.stringify(state.records.find(x=>x.id===id)));formMode='detail';detailId=null;render()}function delRec(id){if(confirm('이 기록을 삭제할까요?')){state.records=state.records.filter(x=>x.id!==id);detailId=null;tab='records';render()}}
function report(){let p=prof(), rec=selectedRecords().filter(x=>within(x.recordedAt,reportRange)), s={cnt:rec.length,itch:avg(rec.map(x=>x.symptoms.itchScore)),scratch:avg(rec.map(x=>x.symptoms.scratchScore))};let photos=rec.filter(x=>x.photos?.length).sort((a,b)=>new Date(a.recordedAt)-new Date(b.recordedAt));return `<div class="screen">${header('Report','병원 리포트')}<div style="margin-bottom:16px">${chips(false)}</div><div class="grid2 card" style="padding:6px;margin-bottom:16px">${[7,30].map(d=>`<button class="btn ${reportRange===d?'btn-soft':''}" onclick="reportRange=${d};render()">최근 ${d}일</button>`).join('')}</div><div class="grid2">${[['기록 횟수',s.cnt+'회'],['가려움 평균',s.itch],['긁음 평균',s.scratch],['가장 심했던 날',rec[0]?fmtD(rec[0].recordedAt):'-']].map(x=>`<div class="card p20" style="text-align:center"><span class="small muted">${x[0]}</span><h2>${x[1]}</h2></div>`).join('')}</div><section class="card p20" style="margin-top:16px"><div style="display:flex;justify-content:space-between"><b>사진 변화</b><span class="pill">첫 사진 → 최근 사진</span></div><p class="small muted">선택한 기간 안에서 사진이 있는 첫 기록과 가장 최근 기록을 비교합니다.</p><div class="grid2">${[photos[0],photos[photos.length-1]].map((r,i)=>`<div><div class="photo-box" style="height:120px">${r?`<img src="${r.photos[0].dataUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:20px">`:icon('image')}</div><p class="small muted" style="text-align:center">${i?'최근 기록':'첫 기록'}<br>${r?fmtD(r.recordedAt):'-'}</p></div>`).join('')}</div></section><button class="btn btn-primary" style="width:100%;margin-top:16px" onclick="downloadReport('txt')">TXT 저장</button></div>`}
function settings(){let p=prof();return `<div class="screen">${header('Settings','설정')}<section class="card p20"><div style="display:flex;gap:16px;align-items:center">${avatar(p,66)}<div><p class="small muted">현재 프로필</p><h2 style="margin:4px 0">${esc(p?.nickname||'-')}</h2><p class="muted">${p?.type==='child'?'아이':'본인'} · ${esc(p?.birthInfo||'나이대 미입력')}</p></div></div>${p?.skinMemo?`<div style="background:#f8fafc;border-radius:16px;padding:14px;margin-top:14px">${esc(p.skinMemo)}</div>`:''}<div style="margin-top:16px">${chips(false)}</div><div class="grid2" style="margin-top:16px"><button class="btn btn-white" onclick="editProfileId='${p.id}';render()">프로필 수정</button><button class="btn btn-soft" onclick="addProfile=true;render()">+ 가족 추가</button></div></section><section class="card p20" style="margin-top:16px"><b>데이터 백업</b><p class="muted small">기기 변경이나 브라우저 데이터 삭제 전에 백업해 주세요.</p><div class="grid2"><button class="btn btn-primary" onclick="backup()">백업 저장</button><label class="btn btn-white">백업 불러오기<input type="file" accept="application/json" hidden onchange="restore(this.files[0])"></label></div></section><section class="card p20" style="margin-top:16px;background:#eff6ff;color:#1e3a8a"><b>개인정보 안내</b><p>입력한 기록은 현재 브라우저 저장소에 저장되며 개발자 서버로 자동 전송하지 않습니다.</p></section><button class="btn btn-danger" style="width:100%;margin-top:16px" onclick="resetAll()">모든 데이터 삭제</button></div>`}
function renderProfile(){let init=editProfileId?state.profiles.find(p=>p.id===editProfileId):null;let type=init?.type||'child',avatarData=init?.avatarDataUrl||'';document.getElementById('root').innerHTML=`<div class="screen"><div class="title-row"><div><p class="eyebrow">Profile</p><h1 class="h1">${editProfileId?'프로필 수정':addProfile?'가족 / 프로필 추가':'프로필 생성'}</h1></div>${(addProfile||editProfileId)?`<button class="icon-btn" onclick="addProfile=false;editProfileId=null;render()">${icon('back')}</button>`:''}</div><div class="grid2" style="margin-bottom:16px"><button id="typeSelf" class="btn btn-white" onclick="type='self';document.getElementById('typeHidden').value=type">😊 본인</button><button id="typeChild" class="btn btn-soft" onclick="type='child';document.getElementById('typeHidden').value=type">😘 아이</button></div><input id="typeHidden" type="hidden" value="${type}"><section class="card p16" style="margin-bottom:16px"><label class="label">프로필 사진</label><div style="display:flex;gap:14px;align-items:center"><span id="avatarPrev" class="avatar" style="width:64px;height:64px">${avatarData?`<img src="${avatarData}">`:emoji({type})}</span><label class="btn btn-white">사진 업로드<input type="file" accept="image/*" hidden onchange="let rd=new FileReader();rd.onload=()=>{document.getElementById('avatarData').value=rd.result;document.getElementById('avatarPrev').innerHTML='<img src=&quot;'+rd.result+'&quot;>'};rd.readAsDataURL(this.files[0])"></label><input id="avatarData" type="hidden" value="${esc(avatarData)}"></div></section><div class="field"><label class="label">이름/별명</label><input id="nick" class="input" value="${esc(init?.nickname||'')}" placeholder="예) 지우"></div><div class="field"><label class="label">생년월일 또는 나이대</label><input id="birth" class="input" value="${esc(init?.birthInfo||'')}" placeholder="예) 2018.05 또는 7세"></div><div class="field"><label class="label">피부질환 메모</label><textarea id="memo" class="textarea" placeholder="예) 결절성 양진 치료 경험, 아토피 병력 등">${esc(init?.skinMemo||'')}</textarea></div><button class="btn btn-primary" style="width:100%;height:56px" onclick="saveProfile('${init?.id||''}')">${editProfileId?'수정 저장':addProfile?'추가':'프로필 저장'}</button></div>`}
function saveProfile(id){let nick=document.getElementById('nick').value.trim();if(!nick)return alert('이름 또는 별명을 입력해 주세요.');let p={id:id||uid('profile'),type:document.getElementById('typeHidden').value,nickname:nick,birthInfo:document.getElementById('birth').value.trim(),skinMemo:document.getElementById('memo').value.trim(),avatarDataUrl:document.getElementById('avatarData').value,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};let i=state.profiles.findIndex(x=>x.id===p.id); if(i>=0)state.profiles[i]={...state.profiles[i],...p}; else state.profiles.push(p);state.selectedProfileId=p.id;state.onboardingCompleted=true;addProfile=false;editProfileId=null;render()}
function backup(){dl(`soothenote-backup-${Date.now()}.json`,JSON.stringify(norm(state),null,2),'application/json')}function restore(file){if(!file)return;let rd=new FileReader();rd.onload=()=>{try{state=norm(JSON.parse(rd.result));render();alert('백업 데이터를 불러왔습니다.')}catch(e){alert('백업 파일을 읽을 수 없습니다.')}};rd.readAsText(file)}function resetAll(){if(confirm('모든 데이터를 삭제할까요?')){state={onboardingCompleted:false,profiles:[],selectedProfileId:null,records:[]};localStorage.removeItem(KEY);render()}}
function downloadReport(){dl(`soothenote-report-${reportRange}days.txt`,`${APP_NAME} 병원 리포트\n프로필: ${prof()?.nickname||'-'}\n기간: 최근 ${reportRange}일`,'text/plain;charset=utf-8')}function dl(name,content,type){let b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
load();setTimeout(()=>{splash=false;render()},3000);render();
</script></body></html>
